<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Alfred — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Soft, warm cream background and minimalist base font matching Money Mama */
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
    background: #f9f9f6; 
    color: #1a1a1a; 
    min-height: 100vh; 
    padding-bottom: 105px; 
  }

  /* Streamlined Header Zone */
  .header { 
    background: #fff; 
    padding: 1.25rem 1.5rem; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    border-bottom: 1px solid #e8e8e4; 
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-title { font-size: 19px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.3px; }
  
  /* Minimal Dropdown Styling */
  .month-select { 
    font-size: 13px; 
    padding: 5px 10px; 
    border-radius: 8px; 
    border: 1px solid #e8e8e4; 
    background: #fff; 
    color: #1a1a1a; 
    cursor: pointer; 
    font-weight: 600; 
    outline: none; 
  }
  
  /* Pixel-centered SVG refresh button */
  .refresh-btn { 
    width: 36px; 
    height: 36px; 
    border-radius: 50%; 
    border: 1px solid #e8e8e4; 
    background: transparent; 
    color: #555; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: background 0.2s; 
    padding: 0; 
    outline: none;
  }
  .refresh-btn:hover { background: #f5f5f0; }

  /* Bottom control group — FAB + nav pill share one centered row so they
     always sit on the same vertical axis, regardless of screen width. */
  .bottom-bar {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  /* Floating Bottom Navigation Pill — liquid glass finish */
  .floating-nav { 
    background: rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 27px; 
    display: flex; 
    align-items: center; 
    padding: 4px; 
    box-shadow: 0 8px 32px rgba(0,0,0,0.10), inset 0 1px 1px rgba(255,255,255,0.6);
    width: 260px; 
    height: 54px; 
    overflow: hidden;
  }
  .nav-btn { 
    flex: 1; 
    border: none; 
    background: transparent; 
    color: #777; 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    height: 100%; 
    z-index: 2; 
    transition: color 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.25, 0.64, 1), font-weight 0.3s ease; 
    outline: none; 
    -webkit-tap-highlight-color: transparent; 
  }
  .nav-btn.active { color: #1a1a1a; font-weight: 800; transform: scale(1.08); }
  .nav-slider { 
    position: absolute; 
    top: 4px; 
    bottom: 4px; 
    left: 4px; 
    width: calc(50% - 4px); 
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,1);
    box-shadow: 0 4px 14px rgba(0,0,0,0.14), inset 0 1px 1px rgba(255,255,255,0.9);
    border-radius: 23px; 
    transition: transform 0.5s cubic-bezier(0.34, 1.25, 0.64, 1); 
    z-index: 1; 
    pointer-events: none; 
  }

  /* Floating Action Button (new transaction) — same glass finish as the pill, sits to its right */
  .fab {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10), inset 0 1px 1px rgba(255,255,255,0.6);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.92); }

  .container { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; }
  .view-section { display: none; }
  .view-section.active { display: block; }

  /* Grid Layout: Optimized to fit row cards completely on one page */
  .metric-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 8px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
  }
  @media (max-width: 480px) {
    .metric-grid.home-grid { grid-template-columns: repeat(2, 1fr); }
    .metric-grid.home-grid .balance-card { grid-column: span 2; }
    .metric-grid.analytics-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .metric-grid.analytics-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  /* Highly Rounded Cards with Minimalist Geometry */
  .metric { 
    background: #fff; 
    border-radius: 14px; 
    padding: 0.75rem 0.5rem; 
    border: 1px solid #e8e8e4; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    min-height: 80px; 
  }
  .metric-label { 
    font-size: 10px; 
    color: #888; 
    margin-bottom: 4px; 
    font-weight: 600; 
    text-transform: uppercase; 
    letter-spacing: 0.3px; 
  }
  .metric-val { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .metric-sub { 
    font-size: 9px; 
    color: #aaa; 
    margin-top: 3px; 
    font-weight: 500; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }

  @media (min-width: 360px) {
    .metric-val { font-size: 15px; }
    .metric-label { font-size: 11px; }
    .metric-sub { font-size: 10px; }
    .metric { padding: 1rem 0.5rem; min-height: 90px; }
  }
  @media (min-width: 400px) {
    .metric-val { font-size: 17px; }
  }

  /* Soft thematic analytics crystal ball gradient */
  .metric.crystal-ball { 
    background: radial-gradient(circle at 85% 15%, #fff 0%, #faf9fc 60%, #f5f0ff 100%); 
    border-color: #e1d8ff; 
  }

  /* Centered layouts for chart cards */
  .charts-row { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
    justify-content: center; 
  }
  @media (max-width: 768px) { 
    .charts-row { 
      grid-template-columns: 1fr; 
      max-width: 480px; 
      margin: 0 auto 1.5rem auto; 
    } 
  }

  .card { background: #fff; border-radius: 14px; border: 1px solid #e8e8e4; padding: 1.25rem; width: 100%; display: flex; flex-direction: column; }
  .card-title { font-size: 12px; font-weight: 600; margin-bottom: 14px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Custom Pill Shape Legendary Alignments */
  .custom-pill-legend { display: flex; gap: 12px; justify-content: center; margin-top: 10px; width: 100%; }
  .pill-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #666; padding: 4px 14px; border-radius: 20px; border: 1px solid #e8e8e4; background: #fff; }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .legend-side-box { display: flex; flex-direction: column; gap: 8px; justify-content: center; margin-top: 12px; }
  @media (min-width: 480px) {
    .donut-layout { display: flex; align-items: center; gap: 14px; }
    .donut-container { flex: 1; }
    .legend-side-box { flex: 1; margin-top: 0; }
  }
  
  .legend-row-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: #555; }
  .legend-row-left { display: flex; align-items: center; gap: 6px; }

  .cat-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cat-name { font-size: 12px; color: #666; font-weight: 500; width: 110px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-bar-bg { flex: 1; height: 6px; border-radius: 3px; background: #f2f2ee; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .cat-amt { font-size: 12px; font-weight: 600; width: 72px; text-align: right; flex-shrink: 0; }

  /* Chronological Timeline Presentation */
  .date-group-header { font-size: 12px; font-weight: 700; color: #888; margin: 1.5rem 0 0.5rem 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .txn-list { border-radius: 14px; border: 1px solid #e8e8e4; background: #fff; overflow: hidden; margin-bottom: 0.5rem; }
  
  /* Compact and high-density timeline rows layout */
  .txn-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 10px 1.25rem; 
    border-bottom: 1px solid #f5f5f0; 
    cursor: pointer;
    transition: background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-row:hover { background: #fafaf8; }
  .txn-row:active { background: #f5f5f0; }
  
  .txn-left { display: flex; align-items: center; gap: 12px; }
  .txn-details { display: flex; flex-direction: column; gap: 2px; }
  .txn-badge-container { display: flex; margin-top: 1px; }

  /* Daily Spent Total Row Footer with left accent bar closer to "Spent" label */
  .txn-footer {
    background: #fafaf9;
    padding: 11px 1.25rem 11px 1.45rem; 
    position: relative; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: #666;
    border-top: 1px solid #f5f5f0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  /* Custom floating red vertical bar closer to text */
  .txn-footer::before {
    content: '';
    position: absolute;
    left: 10px; 
    top: 8px;   
    bottom: 8px;
    width: 4px;
    background-color: #FF6B6B; 
    border-radius: 3px; 
  }
  
  .txn-footer-amt {
    color: #FF6B6B; 
    font-size: 13.5px;
    font-weight: 800;
  }
  
  /* Balanced, highly stylized outlined semantic tags */
  .badge { font-size: 9px; padding: 1px 6px; border-radius: 5px; font-weight: 700; white-space: nowrap; background: transparent; border-width: 1px; border-style: solid; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.inc-badge { color: #1D9E75; border-color: #1D9E75; }
  .badge.exp-badge { color: #FF6B6B; border-color: #FF6B6B; }

  .txn-desc { font-size: 13px; font-weight: 600; color: #1a1a1a; line-height: 1.25; }
  .txn-amt { font-size: 13px; font-weight: 700; }
  .txn-amt.income { color: #1D9E75; }
  .txn-amt.expense { color: #FF6B6B; }

  .empty { text-align: center; padding: 3rem 1rem; color: #aaa; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; color: #888; font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #e8e8e4; border-top-color: #1D9E75; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Edit / Add Transaction Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 1.5rem 1.25rem 1.75rem 1.25rem;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.05);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: #e0e0dc; border-radius: 2px; margin: 0 auto 1.1rem auto; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 1.1rem; color: #1a1a1a; }

  .type-toggle { display: flex; background: #f2f2ee; border-radius: 12px; padding: 3px; margin-bottom: 1rem; }
  .type-toggle button {
    flex: 1; border: none; background: transparent; padding: 9px;
    border-radius: 10px; font-size: 13px; font-weight: 700; color: #888; cursor: pointer;
  }
  .type-toggle button.active-expense { background: #fff; color: #FF6B6B; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .type-toggle button.active-income { background: #fff; color: #1D9E75; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  .form-group { margin-bottom: 0.9rem; }
  .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #888; margin-bottom: 5px; display: block; }
  .form-input, .form-select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #e8e8e4;
    font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a; outline: none;
  }
  .form-input:focus, .form-select:focus { border-color: #1a1a1a; }

  .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; }
  .btn { padding: 13px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-primary { flex: 1; background: #1a1a1a; color: #fff; }
  .btn-primary:disabled { opacity: 0.55; }
  .btn-ghost { flex: 1; background: #f2f2ee; color: #555; }
  .btn-danger { flex: 0 0 auto; padding: 13px 16px; background: transparent; color: #FF6B6B; border: 1px solid #FF6B6B; }
  .btn-danger:disabled { opacity: 0.5; }

  .modal-error {
    display: none; background: #fff3f3; color: #c62828; font-size: 12px; font-weight: 600;
    padding: 9px 12px; border-radius: 10px; margin-bottom: 0.9rem;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #141412; color: #e3e3df; }
    .header, .metric, .card, .txn-list, .month-select { background: #1e1e1c; border-color: #2c2c2a; color: #e3e3df; }
    .floating-nav {
      background: rgba(30,30,28,0.45);
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.06);
    }
    .nav-btn { color: #999; }
    .nav-btn.active { color: #fff; }
    .nav-slider {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.28);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.2);
    }
    .fab {
      background: rgba(30,30,28,0.45);
      border-color: rgba(255,255,255,0.08);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.06);
    }
    .cat-bar-bg { background: #2c2c2a; }
    .txn-row { border-color: #2c2c2a; }
    .txn-row:hover { background: #232321; }
    .txn-row:active { background: #29292 6; }
    .txn-footer { background: #252523; border-top-color: #2c2c2a; color: #aaa; }
    .txn-desc, .card-title { color: #e3e3df; }
    .metric.crystal-ball { background: radial-gradient(circle at 85% 15%, #2b243d 0%, #1e1e1c 80%); border-color: #463b61; }

    .modal-sheet { background: #1e1e1c; }
    .modal-handle { background: #3a3a37; }
    .modal-title { color: #e3e3df; }
    .type-toggle { background: #262624; }
    .type-toggle button.active-expense, .type-toggle button.active-income { background: #1e1e1c; }
    .form-input, .form-select { background: #141412; border-color: #2c2c2a; color: #e3e3df; }
    .btn-ghost { background: #262624; color: #ccc; }
    .modal-error { background: #2a1c1c; color: #ff8a8a; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title-row" style="display: flex; align-items: center; gap: 10px;">
      <div class="header-title">Project Alfred</div>
      <select id="month-select-element" class="month-select" onchange="handleMonthDropdown(this.value)"></select>
    </div>
  </div>
  <button class="refresh-btn" onclick="init()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 1 1 0 6M20.49 15a9 9 0 1 1 0-6"/>
    </svg>
  </button>
</div>

<div class="bottom-bar">
  <div class="floating-nav">
    <div id="nav-slider" class="nav-slider"></div>
    <button class="nav-btn active" id="tab-home" onclick="switchView('home')">Home</button>
    <button class="nav-btn" id="tab-analytics" onclick="switchView('analytics')">Analytics</button>
  </div>

  <button class="fab" onclick="openTxnModal(null)" aria-label="Add transaction">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<div class="container">
  <div id="main-loader" class="loading">
    <div class="spinner"></div>
    Reading your Google Sheet...
  </div>

  <div id="home-view" class="view-section">
    <div id="home-metrics" class="metric-grid home-grid"></div>
    <div id="home-timeline"></div>
  </div>

  <div id="analytics-view" class="view-section">
    <div id="analytics-metrics" class="metric-grid analytics-grid"></div>
    <div class="charts-row">
      <div class="card">
        <div class="card-title">Cumulative Spend</div>
        <div id="cumulative-line-container" style="position:relative; width:100%; height:200px">
          <canvas id="cumulative-line"></canvas>
        </div>
        <div class="custom-pill-legend" style="display:flex; gap:10px; justify-content:center; margin-top:10px">
          <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:#666; font-weight:600; padding:4px 12px; border-radius:20px; border:1px solid #e8e8e4;">
            <div style="width:8px; height:8px; border-radius:50%; background:#FF6B6B"></div>This month
          </div>
          <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:#666; font-weight:600; padding:4px 12px; border-radius:20px; border:1px solid #e8e8e4;">
            <div style="width:8px; height:8px; border-radius:50%; background:#b0bec5"></div>Last month
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Expenses by Category</div>
        <div class="donut-layout">
          <div id="donut-container" class="donut-container" style="position:relative; width:100%; height:160px">
            <canvas id="donut"></canvas>
          </div>
          <div class="legend-side-box" id="donut-legend-rows"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Category Breakdown</div>
      <div style="display:flex; flex-direction:column; gap:12px" id="bar-breakdown"></div>
    </div>
  </div>
</div>

<!-- Add / Edit Transaction Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTxnModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Add Transaction</div>

    <div class="modal-error" id="modal-error"></div>

    <input type="hidden" id="modal-uid">

    <div class="type-toggle">
      <button type="button" id="type-expense-btn" onclick="setModalType('Expense')">Expense</button>
      <button type="button" id="type-income-btn" onclick="setModalType('Income')">Income</button>
    </div>
    <input type="hidden" id="modal-type" value="Expense">

    <div class="form-group">
      <label class="form-label">Amount (MYR)</label>
      <input type="number" step="0.01" inputmode="decimal" class="form-input" id="modal-amount" placeholder="0.00">
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="modal-category"></select>
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <input type="text" class="form-input" id="modal-desc" placeholder="e.g. Lunch at Village Park">
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input type="date" class="form-input" id="modal-date">
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="modal-delete-btn" onclick="deleteTxn()" style="display:none">Delete</button>
      <button type="button" class="btn btn-ghost" onclick="closeTxnModal()">Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-save-btn" onclick="saveTxn()">Save</button>
    </div>
  </div>
</div>

<script>
const SHEET_ID = "19_C3gFlY7hDjGm87k3Uke63_Tgg6TQPl6xLiGZvuEis";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

// Write endpoint — deployed Apps Script already handles add/edit/delete,
// keyed by UID, and responds with {success:true} or {error:"..."}.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxRLfHCAbCspXIWSRt1xVAbLnNPlhiHHaWpTHGB23N1wkoMU74nHifMT9prU3rM4m6/exec";
const SECRET_KEY = "8891";

const CAT_COLORS = {
  "Food & Dining":     { hex: "#FF6B6B", light: "#FFEAEA", text: "#D32F2F" },
  "Transport":         { hex: "#00BFA5", light: "#E0F2F1", text: "#004D40" },
  "Bills & Utilities": { hex: "#FFAB00", light: "#FFF8E1", text: "#FF6D00" },
  "Shopping":          { hex: "#2979FF", light: "#E3F2FD", text: "#0D47A1" },
  "Groceries":         { hex: "#AA00FF", light: "#F3E5F5", text: "#4A148C" },
  "Entertainment":     { hex: "#FF3D00", light: "#FBE9E7", text: "#BF360C" },
  "Other":             { hex: "#78909C", light: "#ECEFF1", text: "#263238" }
};
// From ALFRED_BOT_CONTEXT.md — used when Type = Income
const INCOME_CATEGORIES = ["Salary", "Freelance", "Bonus", "Investment", "Side Income", "Reimbursement", "Other Income"];

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allRows = [];
let activeMonth = new Date().getMonth();
let activeYear = new Date().getFullYear();
let currentView = 'home';

let donutChart = null;
let lineChart = null;

// Formats currencies dynamically with thousands separator commas
function formatCurrency(num) {
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Register custom positioning calculator to strictly pin the tooltip on the Red Line (Dataset Index 0)
Chart.Tooltip.positioners.thisMonthOnly = function(elements) {
  if (!elements || elements.length === 0) return false;
  const target = elements.find(el => el.datasetIndex === 0);
  if (target && target.element) {
    return { x: target.element.x, y: target.element.y };
  }
  const first = elements[0];
  if (first && first.element) {
    return { x: first.element.x, y: first.element.y };
  }
  return false;
};

const centerTextPlugin = {
  id: 'centerText',
  afterDraw: (chart) => {
    if (chart.config.type !== 'doughnut') return;
    const { ctx, chartArea: { left, top, right, bottom } } = chart;
    const centerX = (left + right) / 2, centerY = (top + bottom) / 2;
    ctx.save();
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.font = '500 11px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#aaa' : '#888';
    ctx.textAlign = 'center';
    ctx.fillText("Total", centerX, centerY - 10);
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#e3e3df' : '#1a1a1a';
    ctx.fillText("RM " + formatCurrency(chart.config.options.plugins.centerText.totalAmount), centerX, centerY + 8);
    ctx.restore();
  }
};
Chart.register(centerTextPlugin);

// --- NUMBER COUNTER ANIMATION ENGINE ---
function animateCounters() {
  const counters = document.querySelectorAll('.counter-val');
  counters.forEach(counter => {
    const target = parseFloat(counter.getAttribute('data-val')) || 0;
    const prefix = counter.getAttribute('data-prefix') || "";
    const suffix = counter.getAttribute('data-suffix') || "";
    const duration = 1200; // Animation lasts 1.2 seconds
    let startTimestamp = null;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      
      // Easing function makes it slow down smoothly at the end (ease-out)
      const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      const currentVal = target * easeOut;

      counter.innerHTML = prefix + formatCurrency(currentVal) + suffix;

      if (progress < 1) {
        window.requestAnimationFrame(step);
      } else {
        // Ensure it lands exactly on the target value
        counter.innerHTML = prefix + formatCurrency(target) + suffix;
      }
    };
    
    window.requestAnimationFrame(step);
  });
}

// --- INITIALIZATION & FETCHING ---
async function init() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    
    const text = await res.text();
    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const json = JSON.parse(jsonString);
    
    allRows = json.table.rows
      .filter(r => r.c && r.c[0]?.v && r.c[1]?.v) 
      .map(r => {
        let rawDate = r.c[0].v;
        let formattedDate = "";
        
        if (typeof rawDate === 'string' && rawDate.includes('Date')) {
          const dateParts = rawDate.replace("Date(", "").replace(")", "").split(",");
          const year = dateParts[0];
          const month = String(Number(dateParts[1]) + 1).padStart(2, "0");
          const day = String(dateParts[2]).padStart(2, "0");
          formattedDate = `${year}-${month}-${day}`;
        } else {
          // Strips leading apostrophes if they ever occur again
          formattedDate = String(rawDate).replace(/^'/, ""); 
        }

        return {
          Date: formattedDate,
          Amount: Number(r.c[1].v),
          Category: r.c[2]?.v || "Other",
          Description: r.c[3]?.v || "",
          Type: r.c[5]?.v ? String(r.c[5].v).trim() : "Expense",
          UID: r.c[6]?.v ? String(r.c[6].v).trim() : ""
        };
      });
      
    document.getElementById('main-loader').style.display = 'none';
    renderDropdownOptions();
    switchView(currentView);
    
  } catch(e) {
    console.error("Dashboard Error:", e);
    document.getElementById('main-loader').innerHTML = `
      <div style="background:#fff3f3; color:#c00; padding:15px; border-radius:10px; max-width: 400px; text-align: center;">
        ⚠️ Failed to load data.<br><br>Error: ${e.message}
      </div>`;
  }
}

function switchView(view) {
  window.scrollTo(0, 0);
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  
  document.getElementById(`tab-${view}`).classList.add('active');
  document.getElementById(`${view}-view`).classList.add('active');
  document.getElementById('nav-slider').style.transform = (view === 'analytics') ? 'translateX(100%)' : 'translateX(0)';
  
  calculateAndRender();
}

function renderDropdownOptions() {
  const now = new Date();
  let dropdownHtml = '';
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const valString = `${d.getFullYear()}-${d.getMonth()}`;
    const selected = (d.getMonth() === activeMonth && d.getFullYear() === activeYear) ? 'selected' : '';
    dropdownHtml += `<option value="${valString}" ${selected}>${MONTHS[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  document.getElementById('month-select-element').innerHTML = dropdownHtml;
}

function handleMonthDropdown(val) {
  const parts = val.split('-');
  activeYear = parseInt(parts[0]);
  activeMonth = parseInt(parts[1]);
  calculateAndRender();
}

function calculateAndRender() {
  const rows = allRows.filter(r => {
    const d = new Date(r.Date);
    return d.getMonth() === activeMonth && d.getFullYear() === activeYear;
  });

  const totalIncome = rows.filter(r => r.Type === "Income").reduce((s, r) => s + r.Amount, 0);
  const totalExpense = rows.filter(r => r.Type !== "Income").reduce((s, r) => s + r.Amount, 0);
  const netBalance = totalIncome - totalExpense;

  const expenseRows = rows.filter(r => r.Type !== "Income");
  const catTotals = {};
  expenseRows.forEach(r => { catTotals[r.Category] = (catTotals[r.Category] || 0) + r.Amount; });
  const catData = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const maxCat = catData[0]?.[1] || 1;

  // ── RENDERING: HOME TAB CONTAINER ──
  if (currentView === 'home') {
    const balanceCheekySub = netBalance >= 0 ? "In the green! 🎉" : "Watching the leak ⚠️";
    document.getElementById('home-metrics').innerHTML = `
      <div class="metric">
        <div class="metric-label">Income</div>
        <div class="metric-val counter-val" style="color: #1D9E75;" data-val="${totalIncome}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${rows.filter(r => r.Type === "Income").length} items</div>
      </div>
      <div class="metric">
        <div class="metric-label">Expenses</div>
        <div class="metric-val counter-val" style="color: #FF6B6B;" data-val="${totalExpense}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${expenseRows.length} items</div>
      </div>
      <div class="metric balance-card">
        <div class="metric-label">Net Balance</div>
        <div class="metric-val counter-val" style="color: ${netBalance >= 0 ? '#1D9E75' : '#FF6B6B'};" data-val="${netBalance}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${balanceCheekySub}</div>
      </div>
    `;

    if (!rows.length) {
      document.getElementById('home-timeline').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No records found this month.</div>';
    } else {
      const sortedRows = [...rows].sort((a, b) => new Date(b.Date) - new Date(a.Date));
      const groups = {};
      sortedRows.forEach(r => {
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        const dateHeader = new Date(r.Date).toLocaleDateString('en-US', options);
        if (!groups[dateHeader]) groups[dateHeader] = [];
        groups[dateHeader].push(r);
      });

      let timelineHtml = '';
      for (const [dateStr, records] of Object.entries(groups)) {
        const dayExpensesTotal = records
          .filter(r => r.Type !== 'Income')
          .reduce((sum, r) => sum + r.Amount, 0);

        timelineHtml += `<div class="date-group-header">${dateStr}</div><div class="txn-list">`;
        timelineHtml += records.map(r => {
          const isInc = r.Type === "Income";
          const displayTag = isInc ? 'Income' : r.Category.split(' ')[0];
          return `
            <div class="txn-row" data-uid="${r.UID}">
              <div class="txn-left">
                <div class="txn-details">
                  <div class="txn-desc">${r.Description}</div>
                  <div class="txn-badge-container">
                    <span class="badge ${isInc ? 'inc-badge' : 'exp-badge'}">
                      ${displayTag}
                    </span>
                  </div>
                </div>
              </div>
              <span class="txn-amt ${isInc ? 'income' : 'expense'}">
                ${isInc ? '+' : ''}RM ${formatCurrency(r.Amount)}
              </span>
            </div>
          `;
        }).join('');
        
        timelineHtml += `
          <div class="txn-footer">
            <span>Spent this day</span>
            <span class="txn-footer-amt">RM ${formatCurrency(dayExpensesTotal)}</span>
          </div>
        `;
        
        timelineHtml += `</div>`;
      }
      document.getElementById('home-timeline').innerHTML = timelineHtml;

      // Wire up tap-to-edit on every rendered transaction row
      document.querySelectorAll('#home-timeline .txn-row[data-uid]').forEach(el => {
        el.addEventListener('click', () => openTxnModal(el.dataset.uid));
      });
    }
  }

  // ── RENDERING: ANALYTICS TAB CONTAINER ──
  if (currentView === 'analytics') {
    const today = new Date();
    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const isCurrentMonth = (activeMonth === today.getMonth() && activeYear === today.getFullYear());
    const daysElapsed = isCurrentMonth ? today.getDate() : daysInMonth;

    const dailyBurnRate = daysElapsed > 0 ? (totalExpense / daysElapsed) : 0;
    const projectedEndSpend = dailyBurnRate * daysInMonth;
    const burnCheekySub = dailyBurnRate > 100 ? "A bit of a splurge? 💸" : "Keeping it chill 🧊";

    document.getElementById('analytics-metrics').innerHTML = `
      <div class="metric">
        <div class="metric-label">Average Daily Spend</div>
        <div class="metric-val counter-val" style="color: #FF6B6B;" data-val="${dailyBurnRate}" data-prefix="RM " data-suffix="/day">RM 0.00/day</div>
        <div class="metric-sub">${burnCheekySub}</div>
      </div>
      <div class="metric crystal-ball">
        <div class="metric-label" style="color: #7F77DD;">🔮 Forecasted Spend</div>
        <div class="metric-val counter-val" style="color: #534AB7;" data-val="${projectedEndSpend}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">Where you're landing 🛬</div>
      </div>
    `;

    document.getElementById('donut-legend-rows').innerHTML = catData.map(([cat, val]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS["Other"];
      const pct = totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(0) : 0;
      return `
        <div class="legend-row-item">
          <div class="legend-row-left"><span class="legend-dot" style="background:${c.hex}"></span>${cat.split(' ')[0]}</div>
          <div>${pct}%</div>
        </div>
      `;
    }).join('');

    document.getElementById('bar-breakdown').innerHTML = catData.length ? catData.map(([cat, val]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS["Other"];
      return `
        <div class="cat-row">
          <span class="cat-name">${cat}</span>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(val / maxCat * 100).toFixed(1)}%; background:${c.hex}"></div></div>
          <span class="cat-amt">RM ${formatCurrency(val)}</span>
        </div>
      `;
    }).join('') : '<div style="color:#aaa; font-size:13px; padding:10px 0;">No chart profiles mapped.</div>';

    // Recreation of Donut Canvas Container to prevent duplicate Chart.js overlaps
    const donutContainer = document.getElementById('donut-container');
    if (donutContainer) {
      donutContainer.innerHTML = '<canvas id="donut"></canvas>';
    }

    if (donutChart) donutChart.destroy();
    if (catData.length) {
      donutChart = new Chart(document.getElementById('donut'), {
        type: 'doughnut',
        data: {
          labels: catData.map(d => d[0]),
          datasets: [{ 
            data: catData.map(d => d[1]), 
            backgroundColor: catData.map(([cat]) => (CAT_COLORS[cat] || CAT_COLORS["Other"]).hex), 
            borderWidth: 2, 
            borderColor: '#fff' 
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false, 
          cutout: '72%', 
          plugins: { 
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` RM ${ctx.raw.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
              }
            },
            centerText: { totalAmount: totalExpense } 
          } 
        }
      });
    }

    let lastMo = activeMonth - 1;
    let lastYr = activeYear;
    if (lastMo < 0) { lastMo = 11; lastYr -= 1; }

    const lastMonthExpenseRows = allRows.filter(r => {
      const d = new Date(r.Date);
      return d.getMonth() === lastMo && d.getFullYear() === lastYr && r.Type !== "Income";
    });

    const timelineLabels = Array.from({ length: daysInMonth }, (_, i) => i + 1);
    
    let currentSum = 0;
    const currentMonthlyCumulativeData = [];
    for (let day = 1; day <= daysInMonth; day++) {
      if (isCurrentMonth && day > today.getDate()) break;
      const dayExpenses = expenseRows.filter(r => new Date(r.Date).getDate() === day);
      currentSum += dayExpenses.reduce((s, r) => s + r.Amount, 0);
      currentMonthlyCumulativeData.push(currentSum);
    }

    let lastSum = 0;
    const priorMonthlyCumulativeData = [];
    const daysInLastMonth = new Date(lastYr, lastMo + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      if (day <= daysInLastMonth) {
        const dayExpenses = lastMonthExpenseRows.filter(r => new Date(r.Date).getDate() === day);
        lastSum += dayExpenses.reduce((s, r) => s + r.Amount, 0);
      }
      priorMonthlyCumulativeData.push(lastSum);
    }

    const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    // Recreation of Line Canvas Container to cleanly wipe and detach event configurations
    const lineContainer = document.getElementById('cumulative-line-container');
    if (lineContainer) {
      lineContainer.innerHTML = '<canvas id="cumulative-line"></canvas>';
    }

    const lineCanvas = document.getElementById('cumulative-line');

    if (lineChart) lineChart.destroy();
    lineChart = new Chart(lineCanvas, {
      type: 'line',
      data: {
        labels: timelineLabels,
        datasets: [
          { 
            label: 'This Month', 
            data: currentMonthlyCumulativeData, 
            borderColor: '#FF6B6B', 
            backgroundColor: 'transparent', 
            borderWidth: 3, 
            pointRadius: 3,
            pointHoverRadius: 6, // Slightly larger active target node
            pointBackgroundColor: '#fff',
            pointBorderColor: '#FF6B6B',
            pointBorderWidth: 2,
            tension: 0.1 
          },
          { 
            label: 'Last Month', 
            data: priorMonthlyCumulativeData, 
            borderColor: '#b0bec5', 
            backgroundColor: 'transparent', 
            borderWidth: 2, 
            borderDash: [5, 5], 
            pointRadius: 0, 
            tension: 0.1 
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
          legend: { display: false },
          tooltip: {
            enabled: true,
            position: 'thisMonthOnly',
            intersect: false,
            filter: function(tooltipItem) {
              return tooltipItem.datasetIndex === 0;
            },
            callbacks: {
              label: (ctx) => ` ${ctx.dataset.label}: RM ${ctx.raw.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
            }
          }
        },
        interaction: {
          mode: 'index',
          intersect: false
        },
        scales: {
          x: { 
            grid: { 
              display: true,
              color: isDarkMode ? '#2c2c2a' : '#e8e8e4',
              lineWidth: 0.5
            }, 
            ticks: {
              color: isDarkMode ? '#aaa' : '#888',
              font: { size: 10 }
            }
          },
          y: { 
            beginAtZero: true, 
            grid: { 
              display: true,
              color: isDarkMode ? '#2c2c2a' : '#e8e8e4',
              lineWidth: 0.5
            },
            ticks: {
              color: isDarkMode ? '#aaa' : '#888',
              font: { size: 10 },
              callback: (val) => val.toLocaleString('en-US')
            }
          }
        }
      }
    });

    const dismissTooltip = () => {
      if (lineChart) {
        lineChart.setActiveElements([]);
        if (lineChart.tooltip) {
          lineChart.tooltip.setActiveElements([], {});
        }
        lineChart.update('none'); 
      }
    };

    lineCanvas.addEventListener('touchend', dismissTooltip);
    lineCanvas.addEventListener('touchcancel', dismissTooltip);
    lineCanvas.addEventListener('mouseleave', dismissTooltip);
  }

  // Trigger the number slot-machine animation after all HTML is rendered!
  animateCounters();
}

// ─────────────────────────────────────────────────────────────
// ADD / EDIT / DELETE — Transaction Modal
// ─────────────────────────────────────────────────────────────

function populateCategoryOptions(type, selected) {
  const cats = type === 'Income' ? INCOME_CATEGORIES : Object.keys(CAT_COLORS);
  const sel = document.getElementById('modal-category');
  sel.innerHTML = cats.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function setModalType(type) {
  document.getElementById('modal-type').value = type;
  document.getElementById('type-expense-btn').classList.toggle('active-expense', type === 'Expense');
  document.getElementById('type-income-btn').classList.toggle('active-income', type === 'Income');
  populateCategoryOptions(type);
}

function openTxnModal(uid) {
  const record = uid ? allRows.find(r => r.UID === uid) : null;
  const isEdit = !!record;

  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-uid').value = isEdit ? uid : '';
  document.getElementById('modal-title').textContent = isEdit ? 'Edit Transaction' : 'Add Transaction';
  document.getElementById('modal-delete-btn').style.display = isEdit ? 'inline-flex' : 'none';

  const type = isEdit ? record.Type : 'Expense';
  setModalType(type);
  if (isEdit) populateCategoryOptions(type, record.Category);

  document.getElementById('modal-amount').value = isEdit ? record.Amount : '';
  document.getElementById('modal-desc').value = isEdit ? record.Description : '';
  document.getElementById('modal-date').value = isEdit ? record.Date : new Date().toISOString().slice(0, 10);

  document.getElementById('modal-overlay').classList.add('open');
}

function closeTxnModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function showModalError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function saveTxn() {
  const uid = document.getElementById('modal-uid').value;
  const isEdit = !!uid;

  const amount = parseFloat(document.getElementById('modal-amount').value);
  const description = document.getElementById('modal-desc').value.trim();
  const date = document.getElementById('modal-date').value;
  const category = document.getElementById('modal-category').value;
  const type = document.getElementById('modal-type').value;

  if (!date || isNaN(amount) || amount <= 0 || !description) {
    showModalError('Please fill in a valid date, amount, and description.');
    return;
  }

  const payload = { key: SECRET_KEY, action: isEdit ? 'edit' : 'add', uid, date, amount, category, description, type };

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    document.getElementById('main-loader').innerHTML = '<div class="spinner"></div>Reading your Google Sheet...';
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('analytics-view').classList.remove('active');
    await init();
  } catch (e) {
    showModalError('Could not save: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteTxn() {
  const uid = document.getElementById('modal-uid').value;
  if (!uid) return;
  if (!confirm('Delete this transaction? This cannot be undone.')) return;

  const btn = document.getElementById('modal-delete-btn');
  btn.disabled = true;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: 'delete', uid })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    document.getElementById('main-loader').innerHTML = '<div class="spinner"></div>Reading your Google Sheet...';
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('analytics-view').classList.remove('active');
    await init();
  } catch (e) {
    showModalError('Could not delete: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

init();
</script>
