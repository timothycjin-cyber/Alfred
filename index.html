<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Alfred — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,300..900,75..125&display=swap" rel="stylesheet">
<style>
  /* ────────────────────────────────────────────────────────────
     M3 EXPRESSIVE DESIGN TOKENS — CLEAN MONOCHROME
     ──────────────────────────────────────────────────────────── */
  :root {
    /* High-Vibrancy Semantic Fin-Colors (Punchy & Sharp) */
    --semantic-income: #00A36C;
    --semantic-expense: #E53E3E;

    /* Layout & Brand Accents — Clean Slate Monochromatic Framework */
    --primary: #1A1A1A; 
    --on-primary: #FFFFFF;
    --primary-container: #E9ECEF; 
    --on-primary-container: #1A1A1A;

    --secondary: #343A40;
    --on-secondary: #FFFFFF;
    --secondary-container: #F8F9FA;
    --on-secondary-container: #212529;

    --tertiary: #495057;
    --on-tertiary: #FFFFFF;
    --tertiary-container: #E9ECEF;
    --on-tertiary-container: #212529;

    /* Base Surfaces — Clean Monotone Light Grays (No warm cream tones) */
    --surface: #F8F9FA;
    --surface-container-low: #FFFFFF;
    --surface-container: #F1F3F5;
    --surface-container-high: #E9ECEF;
    --outline: #6C757D;
    --outline-variant: #E9ECEF;
    --on-surface: #212529;
    --on-surface-variant: #495057;

    /* Micro-Washes for Metrics Cards */
    --wash-income: rgba(0, 163, 108, 0.04);
    --wash-expense: rgba(229, 62, 62, 0.04);
    --wash-hero: rgba(33, 37, 41, 0.03);

    /* M3 Shape Library Scales */
    --shape-xs: 6px;
    --shape-sm: 10px;
    --shape-md: 14px;
    --shape-lg: 20px;
    --shape-xl: 28px;
    --shape-full: 999px;

    /* Physical Motion System — High Velocity + Intentional Elastic Wobble */
    --motion-wobble: 420ms cubic-bezier(0.34, 1.85, 0.4, 0.85);
    --motion-snap: 220ms cubic-bezier(0.25, 1, 0.3, 1);
    --motion-standard: 250ms cubic-bezier(0.2, 0, 0, 1);

    --font-body: 'Roboto Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --semantic-income: #2ECC71;
      --semantic-expense: #FF4D4D;

      --primary: #F8F9FA;
      --on-primary: #212529;
      --primary-container: #2B3035;
      --on-primary-container: #F8F9FA;

      --surface: #121212;
      --surface-container-low: #1E1E1E;
      --surface-container: #2D2D2D;
      --surface-container-high: #3D3D3D;
      --outline: #ADB5BD;
      --outline-variant: #2D2D2D;
      --on-surface: #F8F9FA;
      --on-surface-variant: #CED4DA;

      --wash-income: rgba(46, 204, 113, 0.06);
      --wash-expense: rgba(255, 77, 77, 0.06);
      --wash-hero: rgba(248, 249, 250, 0.04);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body { 
    font-family: var(--font-body);
    font-variation-settings: 'wght' 400, 'wdth' 100;
    background: var(--surface); 
    color: var(--on-surface); 
    min-height: 100vh; 
    padding-bottom: 115px; 
  }

  /* Header Layout */
  .header { 
    background: var(--surface-container-low); 
    padding: 1.25rem 1.5rem; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    border-bottom: 1px solid var(--outline-variant); 
  }
  .header-title { 
    font-size: 20px; 
    font-weight: 800; 
    font-variation-settings: 'wght' 700, 'wdth' 105; 
    color: var(--on-surface); 
    letter-spacing: -0.4px; 
  }
  
  .month-select { 
    font-size: 13px; 
    padding: 5px 10px; 
    border-radius: var(--shape-sm); 
    border: 1px solid var(--outline-variant); 
    background: var(--surface-container-low); 
    color: var(--on-surface); 
    cursor: pointer; 
    font-weight: 600; 
    outline: none; 
  }
  
  .refresh-btn { 
    width: 36px; 
    height: 36px; 
    border-radius: var(--shape-full); 
    border: 1px solid var(--outline-variant); 
    background: transparent; 
    color: var(--on-surface-variant); 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: background var(--motion-standard), transform var(--motion-snap); 
    padding: 0; 
    outline: none;
  }
  .refresh-btn:hover { background: var(--surface-container); }
  .refresh-btn:active { transform: rotate(180deg); }

  /* Bottom Controls Layer Layout */
  .bottom-bar {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  .floating-nav { 
    position: relative;
    background: rgba(255, 255, 255, 0.75);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.08); 
    border-radius: var(--shape-full); 
    display: flex; 
    align-items: center; 
    padding: 4px; 
    box-shadow: 0 12px 32px rgba(0,0,0,0.06), inset 0 1px 1px rgba(255,255,255,0.8);
    width: 230px; 
    height: 48px; 
  }
  @media (prefers-color-scheme: dark) {
    .floating-nav {
      background: rgba(30, 30, 30, 0.75);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
  }
  
  .nav-btn { 
    flex: 1; 
    border: none; 
    background: transparent; 
    color: var(--on-surface-variant); 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    height: 100%; 
    z-index: 2; 
    outline: none; 
    transition: color var(--motion-standard);
  }
  .nav-btn.active { color: var(--on-primary); font-weight: 700; }
  
  .nav-slider { 
    position: absolute; 
    top: 4px; 
    bottom: 4px; 
    left: 4px; 
    width: calc(50% - 4px); 
    background: var(--primary);
    border-radius: var(--shape-full); 
    transition: transform var(--motion-wobble); 
    z-index: 1; 
    pointer-events: none; 
  }

  /* Kinetic Action FAB */
  .fab {
    width: 48px;
    height: 48px;
    border-radius: var(--shape-full);
    background: var(--primary);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    color: var(--surface-container-low);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    cursor: pointer;
    flex-shrink: 0;
    outline: none;
    transition: transform var(--motion-snap);
  }
  .fab svg {
    transition: transform var(--motion-wobble);
    transform-origin: center;
  }
  .fab:active { transform: scale(0.9); }
  body.modal-open-state .fab svg { transform: rotate(135deg); }

  .container { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; }
  .view-section { display: none; }
  .view-section.active { display: block; }

  /* Layout Systems Grid Configuration */
  .metric-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 12px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
  }
  @media (max-width: 480px) {
    .metric-grid.home-grid { 
      grid-template-columns: repeat(2, 1fr); 
      max-width: 440px;
      margin: 0 auto 1.5rem auto;
    }
    .metric-grid.home-grid .balance-card { grid-column: span 2; }
    
    /* Strict Mobile Blueprint Centering Constraints for Analytics Cards */
    .metric-grid.analytics-grid { 
      grid-template-columns: repeat(2, 1fr); 
      max-width: 440px;
      margin: 0 auto 1.5rem auto;
    }
  }

  /* Tonal Container Washed Surfaces */
  .metric { 
    background: var(--surface-container-low); 
    border-radius: var(--shape-lg); 
    padding: 1.25rem 1rem; 
    border: 1px solid var(--outline-variant); 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    min-height: 100px; 
  }
  .metric.income-card { background: var(--wash-income); }
  .metric.expense-card { background: var(--wash-expense); }
  
  /* Asymmetric Layout Hero Balance Card Design Requirements */
  .metric.balance-card { 
    background: var(--wash-hero);
    border-color: var(--outline);
    border-radius: var(--shape-xl) var(--shape-xs) var(--shape-xl) var(--shape-xs);
  }
  
  .metric-label { 
    font-size: 11px; 
    color: var(--on-surface-variant); 
    margin-bottom: 6px; 
    font-weight: 700; 
    text-transform: uppercase; 
    letter-spacing: 0.5px; 
  }
  
  .metric-val { 
    font-size: 18px; 
    font-weight: 700; 
    white-space: nowrap; 
  }
  
  /* Editorial Display Treatment Headline Metric Scale */
  .metric.balance-card .metric-val {
    font-size: 34px;
    font-weight: 900;
    font-variation-settings: 'wght' 850, 'wdth' 80;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 2px 0;
  }
  
  .metric-sub { 
    font-size: 10px; 
    color: var(--on-surface-variant); 
    opacity: 0.85;
    margin-top: 4px; 
    font-weight: 600; 
  }

  .metric.crystal-ball { 
    background: radial-gradient(circle at 85% 15%, var(--surface-container-low) 0%, var(--tertiary-container) 160%); 
    border-color: var(--outline-variant); 
  }

  /* Centered desktop/mobile viewports structural containers */
  .charts-row { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
  }
  @media (max-width: 768px) { 
    .charts-row { 
      grid-template-columns: 1fr; 
      max-width: 440px; 
      margin: 0 auto 1.5rem auto; 
    } 
  }

  .card { background: var(--surface-container-low); border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); padding: 1.25rem; width: 100%; display: flex; flex-direction: column; }
  
  /* Analytics section specific layout wrapper center-locks on tiny viewports */
  @media (max-width: 768px) {
    #analytics-view > .card {
      max-width: 440px;
      margin: 0 auto;
    }
  }
  
  .card-title { font-size: 11px; font-weight: 700; margin-bottom: 14px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; }

  .custom-pill-legend { display: flex; gap: 12px; justify-content: center; margin-top: 10px; width: 100%; }
  .pill-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 12px; border-radius: var(--shape-full); border: 1px solid var(--outline-variant); background: var(--surface-container-low); }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; }
  
  .legend-side-box { display: flex; flex-direction: column; gap: 8px; justify-content: center; margin-top: 12px; }
  @media (min-width: 480px) {
    .donut-layout { display: flex; align-items: center; gap: 14px; }
    .donut-container { flex: 1; }
    .legend-side-box { flex: 1; margin-top: 0; }
  }
  
  .legend-row-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
  .legend-row-left { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .cat-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cat-name { font-size: 12px; color: var(--on-surface-variant); font-weight: 500; width: 110px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-bar-bg { flex: 1; height: 6px; border-radius: var(--shape-full); background: var(--surface-container); overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: var(--shape-full); transition: width var(--motion-wobble); }
  .cat-amt { font-size: 12px; font-weight: 600; width: 72px; text-align: right; flex-shrink: 0; }

  /* Timeline Presentation Layout */
  .date-group-header { font-size: 11px; font-weight: 700; color: var(--on-surface-variant); margin: 1.5rem 0 0.5rem 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .txn-list { border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); background: var(--surface-container-low); overflow: hidden; margin-bottom: 0.5rem; }
  
  .txn-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 12px 1.25rem; 
    border-bottom: 1px solid var(--outline-variant); 
    cursor: pointer;
    background: transparent;
    transition: background-color var(--motion-snap);
    outline: none;
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-row:hover { background: rgba(0, 0, 0, 0.02); }
  .txn-row:active { background: rgba(0, 0, 0, 0.05); }
  
  @media (prefers-color-scheme: dark) {
    .txn-row:hover { background: rgba(255, 255, 255, 0.02); }
    .txn-row:active { background: rgba(255, 255, 255, 0.05); }
  }
  
  .txn-left { display: flex; align-items: center; gap: 12px; }
  .txn-details { display: flex; flex-direction: column; gap: 2px; }
  .txn-badge-container { display: flex; margin-top: 1px; }

  /* Day subtotal elements styles setup */
  .txn-footer {
    background: var(--surface-container);
    padding: 11px 1.25rem 11px 1.45rem; 
    position: relative; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-surface); 
    border-top: 1px solid var(--outline-variant);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .txn-footer::before {
    content: '';
    position: absolute;
    left: 10px; 
    top: 8px;   
    bottom: 8px;
    width: 3px;
    background-color: var(--semantic-expense); 
    border-radius: var(--shape-xs); 
  }
  .txn-footer-amt {
    color: var(--semantic-expense); 
    font-size: 13.5px;
    font-weight: 700;
  }
  
  .badge { font-size: 9px; padding: 1px 6px; border-radius: var(--shape-xs); font-weight: 700; white-space: nowrap; background: transparent; border-width: 1px; border-style: solid; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.inc-badge { color: var(--semantic-income); border-color: var(--semantic-income); }
  .badge.exp-badge { color: var(--semantic-expense); border-color: var(--semantic-expense); }

  .txn-desc { font-size: 13.5px; font-weight: 600; color: var(--on-surface); line-height: 1.25; }
  .txn-amt { font-size: 13.5px; font-weight: 700; }
  .txn-amt.income { color: var(--semantic-income); }
  .txn-amt.expense { color: var(--semantic-expense); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--on-surface-variant); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; color: var(--on-surface-variant); font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--outline-variant); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Expressive Modal Overlay Framework Sheet */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25); 
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    display: flex;
    align-items: center;      
    justify-content: center;
    padding: 1rem;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--motion-standard) ease, backdrop-filter var(--motion-standard) ease;
  }
  .modal-overlay.open { 
    opacity: 1; 
    pointer-events: auto;
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
  
  .modal-sheet {
    background: var(--surface-container-low);
    border: 1px solid var(--outline-variant);
    width: 100%;
    max-width: 400px;
    border-radius: var(--shape-xl); 
    padding: 1.75rem 1.5rem;
    box-shadow: 0 24px 48px rgba(0,0,0,0.12);
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(0.88) translateY(15px);
    opacity: 0;
    transition: transform var(--motion-wobble), opacity var(--motion-standard);
  }
  .modal-overlay.open .modal-sheet { 
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .modal-title { 
    font-size: 18px; 
    font-weight: 700; 
    margin-bottom: 1.2rem; 
    color: var(--on-surface); 
  }

  /* Toggle Segmented Track Control */
  .type-toggle {
    position: relative;
    display: flex;
    background: var(--surface-container);
    border: 1px solid var(--outline-variant);
    border-radius: var(--shape-md);
    padding: 3px;
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .type-toggle-slider {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    background: var(--surface-container-low);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-radius: var(--shape-sm);
    transition: transform var(--motion-wobble);
    z-index: 1;
    pointer-events: none;
  }
  .type-toggle button {
    position: relative; z-index: 2;
    flex: 1; border: none; background: transparent; padding: 10px;
    border-radius: var(--shape-sm); font-size: 13px; font-weight: 700; color: var(--on-surface-variant); cursor: pointer;
    transition: color var(--motion-standard);
    outline: none;
  }
  .type-toggle button.active-expense { color: var(--semantic-expense); }
  .type-toggle button.active-income { color: var(--semantic-income); }

  .form-group { margin-bottom: 1rem; }
  .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--on-surface-variant); margin-bottom: 6px; display: block; }
  
  .form-input, .form-select {
    width: 100%; padding: 11px 12px; border-radius: var(--shape-sm); border: 1px solid var(--outline-variant);
    font-size: 14px; font-family: inherit; background: var(--surface-container-low); color: var(--on-surface); outline: none;
    transition: border-color var(--motion-snap);
  }
  .form-input:focus, .form-select:focus {
    border-color: var(--primary);
  }

  .modal-actions { display: flex; gap: 8px; margin-top: 1.5rem; }
  .btn {
    padding: 12px; border-radius: var(--shape-md); border: none; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform var(--motion-snap);
    display: inline-flex; align-items: center; justify-content: center;
    outline: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { flex: 1; background: var(--primary); color: var(--surface-container-low); }
  .btn-primary:disabled { opacity: 0.4; }
  
  .btn-ghost {
    flex: 1; color: var(--on-surface);
    background: var(--surface-container);
    border: 1px solid var(--outline-variant);
  }
  .btn-danger {
    flex: 0 0 auto; padding: 12px 16px; color: var(--semantic-expense);
    background: var(--wash-expense);
    border: 1px solid rgba(229, 62, 62, 0.2);
  }
  .btn-danger:disabled { opacity: 0.4; }

  .modal-error {
    display: none; background: var(--wash-expense); color: var(--semantic-expense); font-size: 12px; font-weight: 600;
    padding: 10px 12px; border-radius: var(--shape-sm); margin-bottom: 1rem; border: 1px solid rgba(229, 62, 62, 0.2);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title-row" style="display: flex; align-items: center; gap: 10px;">
      <div class="header-title">Project Alfred</div>
      <select id="month-select-element" class="month-select" onchange="handleMonthDropdown(this.value)"></select>
    </div>
  </div>
  <button class="refresh-btn" onclick="init()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 1 1 0 6M20.49 15a9 9 0 1 1 0-6"/>
    </svg>
  </button>
</div>

<div class="bottom-bar">
  <div class="floating-nav">
    <div id="nav-slider" class="nav-slider"></div>
    <button class="nav-btn active" id="tab-home" onclick="switchView('home')">Home</button>
    <button class="nav-btn" id="tab-analytics" onclick="switchView('analytics')">Analytics</button>
  </div>

  <button class="fab" onclick="openTxnModal(null)" aria-label="Add transaction" id="global-action-fab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<div class="container">
  <div id="main-loader" class="loading">
    <div class="spinner"></div>
    Reading your Google Sheet...
  </div>

  <div id="home-view" class="view-section">
    <div id="home-metrics" class="metric-grid home-grid"></div>
    <div id="home-timeline"></div>
  </div>

  <div id="analytics-view" class="view-section">
    <div id="analytics-metrics" class="metric-grid analytics-grid"></div>
    <div class="charts-row">
      <div class="card">
        <div class="card-title">Cumulative Spend</div>
        <div id="cumulative-line-container" style="position:relative; width:100%; height:200px">
          <canvas id="cumulative-line"></canvas>
        </div>
        <div class="custom-pill-legend">
          <div class="pill-item">
            <div class="pill-dot" style="background:var(--semantic-expense)"></div>This month
          </div>
          <div class="pill-item">
            <div class="pill-dot" style="background:#6C757D"></div>Last month
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Expenses by Category</div>
        <div class="donut-layout">
          <div id="donut-container" class="donut-container" style="position:relative; width:100%; height:160px">
            <canvas id="donut"></canvas>
          </div>
          <div class="legend-side-box" id="donut-legend-rows"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Category Breakdown</div>
      <div style="display:flex; flex-direction:column; gap:12px" id="bar-breakdown"></div>
    </div>
  </div>
</div>

<!-- Add / Edit Transaction Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTxnModal()">
  <div class="modal-sheet">
    <div class="modal-title" id="modal-title">Add Transaction</div>
    <div class="modal-error" id="modal-error"></div>
    <input type="hidden" id="modal-uid">

    <div class="type-toggle">
      <div class="type-toggle-slider" id="type-slider"></div>
      <button type="button" id="type-expense-btn" onclick="setModalType('Expense')">Expense</button>
      <button type="button" id="type-income-btn" onclick="setModalType('Income')">Income</button>
    </div>
    <input type="hidden" id="modal-type" value="Expense">

    <div class="form-group">
      <label class="form-label">Amount (MYR)</label>
      <input type="number" step="0.01" inputmode="decimal" class="form-input" id="modal-amount" placeholder="0.00">
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="modal-category"></select>
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <input type="text" class="form-input" id="modal-desc" placeholder="e.g. Lunch at Village Park">
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input type="date" class="form-input" id="modal-date">
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="modal-delete-btn" onclick="deleteTxn()" style="display:none">Delete</button>
      <button type="button" class="btn btn-ghost" onclick="closeTxnModal()">Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-save-btn" onclick="saveTxn()">Save</button>
    </div>
  </div>
</div>

<script>
const SHEET_ID = "19_C3gFlY7hDjGm87k3Uke63_Tgg6TQPl6xLiGZvuEis";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxRLfHCAbCspXIWSRt1xVAbLnNPlhiHHaWpTHGB23N1wkoMU74nHifMT9prU3rM4m6/exec";
const SECRET_KEY = "8891";

const CAT_COLORS = {
  "Food & Dining":     { hex: "#E53E3E" },
  "Transport":         { hex: "#007A87" },
  "Bills & Utilities": { hex: "#D97706" },
  "Shopping":          { hex: "#2684FF" },
  "Groceries":         { hex: "#6554C0" },
  "Entertainment":     { hex: "#E774BB" },
  "Other":             { hex: "#495057" }
};
const INCOME_CATEGORIES = ["Salary", "Freelance", "Bonus", "Investment", "Side Income", "Reimbursement", "Other Income"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allRows = [];
let activeMonth = new Date().getMonth();
let activeYear = new Date().getFullYear();
let currentView = 'home';

let donutChart = null;
let lineChart = null;

function formatCurrency(num) {
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

Chart.Tooltip.positioners.thisMonthOnly = function(elements) {
  if (!elements || elements.length === 0) return false;
  const target = elements.find(el => el.datasetIndex === 0);
  if (target && target.element) return { x: target.element.x, y: target.element.y };
  const first = elements[0];
  if (first && first.element) return { x: first.element.x, y: first.element.y };
  return false;
};

const centerTextPlugin = {
  id: 'centerText',
  afterDraw: (chart) => {
    if (chart.config.type !== 'doughnut') return;
    const { ctx, chartArea: { left, top, right, bottom } } = chart;
    const centerX = (left + right) / 2, centerY = (top + bottom) / 2;
    ctx.save();
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.font = '700 11px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#CED4DA' : '#495057';
    ctx.textAlign = 'center';
    ctx.fillText("Total", centerX, centerY - 10);
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#F8F9FA' : '#212529';
    ctx.fillText("RM " + formatCurrency(chart.config.options.plugins.centerText.totalAmount), centerX, centerY + 8);
    ctx.restore();
  }
};
Chart.register(centerTextPlugin);

function animateCounters() {
  document.querySelectorAll('.counter-val').forEach(counter => {
    const target = parseFloat(counter.getAttribute('data-val')) || 0;
    const prefix = counter.getAttribute('data-prefix') || "";
    const suffix = counter.getAttribute('data-suffix') || "";
    const duration = 1200;
    let startTimestamp = null;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      const currentVal = target * easeOut;
      counter.innerHTML = prefix + formatCurrency(currentVal) + suffix;
      if (progress < 1) window.requestAnimationFrame(step);
      else counter.innerHTML = prefix + formatCurrency(target) + suffix;
    };
    window.requestAnimationFrame(step);
  });
}

async function init() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const text = await res.text();
    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const json = JSON.parse(jsonString);
    
    allRows = json.table.rows
      .filter(r => r.c && r.c[0]?.v && r.c[1]?.v) 
      .map(r => {
        let rawDate = r.c[0].v;
        let formattedDate = "";
        if (typeof rawDate === 'string' && rawDate.includes('Date')) {
          const dateParts = rawDate.replace("Date(", "").replace(")", "").split(",");
          formattedDate = `${dateParts[0]}-${String(Number(dateParts[1]) + 1).padStart(2, "0")}-${String(dateParts[2]).padStart(2, "0")}`;
        } else {
          formattedDate = String(rawDate).replace(/^'/, ""); 
        }
        return {
          Date: formattedDate,
          Amount: Number(r.c[1].v),
          Category: r.c[2]?.v || "Other",
          Description: r.c[3]?.v || "",
          Type: r.c[5]?.v ? String(r.c[5].v).trim() : "Expense",
          UID: r.c[6]?.v ? String(r.c[6].v).trim() : ""
        };
      });
      
    document.getElementById('main-loader').style.display = 'none';
    renderDropdownOptions();
    switchView(currentView);
  } catch(e) {
    console.error(e);
    document.getElementById('main-loader').innerHTML = `<div style="color:var(--semantic-expense); padding:15px; text-align:center;">⚠️ Failed to load data.</div>`;
  }
}

function switchView(view) {
  window.scrollTo(0, 0);
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.getElementById(`tab-${view}`).classList.add('active');
  document.getElementById(`${view}-view`).classList.add('active');
  document.getElementById('nav-slider').style.transform = (view === 'analytics') ? 'translateX(100%)' : 'translateX(0)';
  calculateAndRender();
}

function renderDropdownOptions() {
  const now = new Date();
  let dropdownHtml = '';
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const valString = `${d.getFullYear()}-${d.getMonth()}`;
    dropdownHtml += `<option value="${valString}" ${(d.getMonth() === activeMonth && d.getFullYear() === activeYear) ? 'selected' : ''}>${MONTHS[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  document.getElementById('month-select-element').innerHTML = dropdownHtml;
}

function handleMonthDropdown(val) {
  const parts = val.split('-');
  activeYear = parseInt(parts[0]);
  activeMonth = parseInt(parts[1]);
  calculateAndRender();
}

function calculateAndRender() {
  const rows = allRows.filter(r => {
    const d = new Date(r.Date);
    return d.getMonth() === activeMonth && d.getFullYear() === activeYear;
  });

  const totalIncome = rows.filter(r => r.Type === "Income").reduce((s, r) => s + r.Amount, 0);
  const totalExpense = rows.filter(r => r.Type !== "Income").reduce((s, r) => s + r.Amount, 0);
  const netBalance = totalIncome - totalExpense;
  const expenseRows = rows.filter(r => r.Type !== "Income");

  const catTotals = {};
  expenseRows.forEach(r => { catTotals[r.Category] = (catTotals[r.Category] || 0) + r.Amount; });
  const catData = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const maxCat = catData[0]?.[1] || 1;

  if (currentView === 'home') {
    document.getElementById('home-metrics').innerHTML = `
      <div class="metric income-card">
        <div class="metric-label">Income</div>
        <div class="metric-val counter-val" style="color: var(--semantic-income);" data-val="${totalIncome}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${rows.filter(r => r.Type === "Income").length} items</div>
      </div>
      <div class="metric expense-card">
        <div class="metric-label">Expenses</div>
        <div class="metric-val counter-val" style="color: var(--semantic-expense);" data-val="${totalExpense}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${expenseRows.length} items</div>
      </div>
      <div class="metric balance-card">
        <div class="metric-label">Net Balance</div>
        <div class="metric-val counter-val" style="color: ${netBalance >= 0 ? 'var(--semantic-income)' : 'var(--semantic-expense)'};" data-val="${netBalance}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${netBalance >= 0 ? 'In the green 🎉' : 'Watching the leak ⚠️'}</div>
      </div>
    `;

    if (!rows.length) {
      document.getElementById('home-timeline').innerHTML = '<div class="empty">No records found.</div>';
    } else {
      const groups = {};
      [...rows].sort((a, b) => new Date(b.Date) - new Date(a.Date)).forEach(r => {
        const dateHeader = new Date(r.Date).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        if (!groups[dateHeader]) groups[dateHeader] = [];
        groups[dateHeader].push(r);
      });

      let timelineHtml = '';
      for (const [dateStr, records] of Object.entries(groups)) {
        const dayExpensesTotal = records.filter(r => r.Type !== 'Income').reduce((sum, r) => sum + r.Amount, 0);
        timelineHtml += `<div class="date-group-header">${dateStr}</div><div class="txn-list">`;
        timelineHtml += records.map(r => {
          const isInc = r.Type === "Income";
          return `
            <div class="txn-row" data-uid="${r.UID}">
              <div class="txn-left">
                <div class="txn-details">
                  <div class="txn-desc">${r.Description}</div>
                  <div class="txn-badge-container"><span class="badge ${isInc ? 'inc-badge' : 'exp-badge'}">${isInc ? 'Income' : r.Category.split(' ')[0]}</span></div>
                </div>
              </div>
              <span class="txn-amt ${isInc ? 'income' : 'expense'}">${isInc ? '+' : ''}RM ${formatCurrency(r.Amount)}</span>
            </div>
          `;
        }).join('');
        timelineHtml += `<div class="txn-footer"><span>Spent this day</span><span class="txn-footer-amt">RM ${formatCurrency(dayExpensesTotal)}</span></div></div>`;
      }
      document.getElementById('home-timeline').innerHTML = timelineHtml;
      document.querySelectorAll('#home-timeline .txn-row[data-uid]').forEach(el => {
        el.addEventListener('click', () => openTxnModal(el.dataset.uid));
      });
    }
  }

  if (currentView === 'analytics') {
    const today = new Date();
    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const isCurrentMonth = (activeMonth === today.getMonth() && activeYear === today.getFullYear());
    const daysElapsed = isCurrentMonth ? today.getDate() : daysInMonth;
    const dailyBurnRate = daysElapsed > 0 ? (totalExpense / daysElapsed) : 0;

    document.getElementById('analytics-metrics').innerHTML = `
      <div class="metric">
        <div class="metric-label">Average Daily Spend</div>
        <div class="metric-val counter-val" style="color: var(--semantic-expense);" data-val="${dailyBurnRate}" data-prefix="RM " data-suffix="/day">RM 0.00/day</div>
        <div class="metric-sub">${dailyBurnRate > 100 ? 'Splurging 💸' : 'Cooling 🧊'}</div>
      </div>
      <div class="metric crystal-ball">
        <div class="metric-label" style="color: var(--on-surface-variant);">🔮 Forecasted Spend</div>
        <div class="metric-val counter-val" style="color: var(--on-surface);" data-val="${dailyBurnRate * daysInMonth}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">Landing trajectory</div>
      </div>
    `;

    document.getElementById('donut-legend-rows').innerHTML = catData.map(([cat, val]) => {
      return `<div class="legend-row-item"><div class="legend-row-left"><span class="legend-dot" style="background:${(CAT_COLORS[cat] || CAT_COLORS["Other"]).hex}"></span>${cat.split(' ')[0]}</div><div>${totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(0) : 0}%</div></div>`;
    }).join('');

    document.getElementById('bar-breakdown').innerHTML = catData.length ? catData.map(([cat, val]) => {
      return `<div class="cat-row"><span class="cat-name">${cat}</span><div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(val / maxCat * 100).toFixed(1)}%; background:${(CAT_COLORS[cat] || CAT_COLORS["Other"]).hex}"></div></div><span class="cat-amt">RM ${formatCurrency(val)}</span></div>`;
    }).join('') : '<div style="font-size:13px; padding:10px 0;">No chart profiles mapped.</div>';

    const donutContainer = document.getElementById('donut-container');
    if (donutContainer) donutContainer.innerHTML = '<canvas id="donut"></canvas>';

    if (donutChart) donutChart.destroy();
    if (catData.length) {
      donutChart = new Chart(document.getElementById('donut'), {
        type: 'doughnut',
        data: {
          labels: catData.map(d => d[0]),
          datasets: [{ data: catData.map(d => d[1]), backgroundColor: catData.map(([cat]) => (CAT_COLORS[cat] || CAT_COLORS["Other"]).hex), borderWidth: 1, borderColor: 'var(--surface-container-low)' }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, centerText: { totalAmount: totalExpense } } }
      });
    }

    let lastMo = activeMonth - 1, lastYr = activeYear;
    if (lastMo < 0) { lastMo = 11; lastYr -= 1; }
    const lastMonthExpenseRows = allRows.filter(r => { const d = new Date(r.Date); return d.getMonth() === lastMo && d.getFullYear() === lastYr && r.Type !== "Income"; });

    let currentSum = 0, lastSum = 0;
    const currentMonthlyCumulativeData = [], priorMonthlyCumulativeData = [];
    const daysInLastMonth = new Date(lastYr, lastMo + 1, 0).getDate();

    for (let day = 1; day <= daysInMonth; day++) {
      if (!isCurrentMonth || day <= today.getDate()) {
        currentSum += expenseRows.filter(r => new Date(r.Date).getDate() === day).reduce((s, r) => s + r.Amount, 0);
        currentMonthlyCumulativeData.push(currentSum);
      }
      if (day <= daysInLastMonth) {
        lastSum += lastMonthExpenseRows.filter(r => new Date(r.Date).getDate() === day).reduce((s, r) => s + r.Amount, 0);
      }
      priorMonthlyCumulativeData.push(lastSum);
    }

    const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const lineContainer = document.getElementById('cumulative-line-container');
    if (lineContainer) lineContainer.innerHTML = '<canvas id="cumulative-line"></canvas>';

    if (lineChart) lineChart.destroy();
    lineChart = new Chart(document.getElementById('cumulative-line'), {
      type: 'line',
      data: {
        labels: Array.from({ length: daysInMonth }, (_, i) => i + 1),
        datasets: [
          { label: 'This Month', data: currentMonthlyCumulativeData, borderColor: 'var(--semantic-expense)', backgroundColor: 'transparent', borderWidth: 3, pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: '#fff', pointBorderColor: 'var(--semantic-expense)', pointBorderWidth: 2, tension: 0.1 },
          { label: 'Last Month', data: priorMonthlyCumulativeData, borderColor: '#6C757D', backgroundColor: 'transparent', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, tension: 0.1 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true, position: 'thisMonthOnly', intersect: false, filter: (item) => item.datasetIndex === 0 } },
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { display: true, color: isDarkMode ? '#2D2D2D' : '#E9ECEF', lineWidth: 0.5 }, ticks: { color: isDarkMode ? '#CED4DA' : '#495057', font: { size: 10 } } },
          y: { beginAtZero: true, grid: { display: true, color: isDarkMode ? '#2D2D2D' : '#E9ECEF', lineWidth: 0.5 }, ticks: { color: isDarkMode ? '#CED4DA' : '#495057', font: { size: 10 }, callback: (val) => val.toLocaleString('en-US') } }
        }
      }
    });
  }
  animateCounters();
}

function populateCategoryOptions(type, selected) {
  const sel = document.getElementById('modal-category');
  sel.innerHTML = (type === 'Income' ? INCOME_CATEGORIES : Object.keys(CAT_COLORS)).map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function setModalType(type) {
  document.getElementById('modal-type').value = type;
  document.getElementById('type-expense-btn').classList.toggle('active-expense', type === 'Expense');
  document.getElementById('type-income-btn').classList.toggle('active-income', type === 'Income');
  document.getElementById('type-slider').style.transform = type === 'Income' ? 'translateX(100%)' : 'translateX(0)';
  populateCategoryOptions(type, document.getElementById('modal-category').value);
}

function openTxnModal(uid) {
  const record = uid ? allRows.find(r => r.UID === uid) : null;
  const isEdit = !!record;

  document.body.classList.add('modal-open-state');
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-uid').value = isEdit ? uid : '';
  document.getElementById('modal-title').textContent = isEdit ? 'Edit Transaction' : 'Add Transaction';
  document.getElementById('modal-delete-btn').style.display = isEdit ? 'inline-flex' : 'none';

  const type = isEdit ? record.Type : 'Expense';
  setModalType(type);
  populateCategoryOptions(type, isEdit ? record.Category : undefined);

  document.getElementById('modal-amount').value = isEdit ? record.Amount : '';
  document.getElementById('modal-desc').value = isEdit ? record.Description : '';
  document.getElementById('modal-date').value = isEdit ? record.Date : new Date().toISOString().slice(0, 10);

  document.getElementById('modal-overlay').classList.add('open');
}

function closeTxnModal() {
  document.body.classList.remove('modal-open-state');
  document.getElementById('modal-overlay').classList.remove('open');
}

function showModalError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function saveTxn() {
  const uid = document.getElementById('modal-uid').value;
  const isEdit = !!uid;
  const amount = parseFloat(document.getElementById('modal-amount').value);
  const description = document.getElementById('modal-desc').value.trim();
  const date = document.getElementById('modal-date').value;
  const category = document.getElementById('modal-category').value;
  const type = document.getElementById('modal-type').value;

  if (!date || isNaN(amount) || amount <= 0 || !description) {
    showModalError('Please fill in a valid date, amount, and description.');
    return;
  }

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: isEdit ? 'edit' : 'add', uid, date, amount, category, description, type })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    await init();
  } catch (e) {
    showModalError('Could not save: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteTxn() {
  const uid = document.getElementById('modal-uid').value;
  if (!uid || !confirm('Delete this transaction?')) return;
  const btn = document.getElementById('modal-delete-btn');
  btn.disabled = true;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: 'delete', uid })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    await init();
  } catch (e) {
    showModalError('Could not delete: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

init();
</script>
</body>
