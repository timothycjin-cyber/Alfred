<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Alfred — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,300..900,75..125&display=swap" rel="stylesheet">
<style>
  /* ────────────────────────────────────────────────────────────
     M3 EXPRESSIVE DESIGN TOKENS — CLEAN MONOCHROME
     ──────────────────────────────────────────────────────────── */
  :root {
    --semantic-income: #00A36C;
    --semantic-expense: #E53E3E;
    --primary: #1A1A1A; 
    --on-primary: #FFFFFF;
    --primary-container: #E9ECEF; 
    --on-primary-container: #1A1A1A;
    --secondary: #343A40;
    --on-secondary: #FFFFFF;
    --secondary-container: #F8F9FA;
    --on-secondary-container: #212529;
    --tertiary: #495057;
    --on-tertiary: #FFFFFF;
    --tertiary-container: #E9ECEF;
    --on-tertiary-container: #212529;
    --surface: #F8F9FA;
    --surface-container-low: #FFFFFF;
    --surface-container: #F1F3F5;
    --surface-container-high: #E9ECEF;
    --outline: #6C757D;
    --outline-variant: #E9ECEF;
    --on-surface: #212529;
    --on-surface-variant: #495057;
    --wash-income: rgba(0, 163, 108, 0.04);
    --wash-expense: rgba(229, 62, 62, 0.04);
    --wash-hero: rgba(33, 37, 41, 0.03);
    --shape-xs: 6px;
    --shape-sm: 10px;
    --shape-md: 14px;
    --shape-lg: 20px;
    --shape-xl: 28px;
    --shape-full: 999px;
    --motion-wobble: 420ms cubic-bezier(0.34, 1.85, 0.4, 0.85);
    --motion-snap: 220ms cubic-bezier(0.25, 1, 0.3, 1);
    --motion-standard: 250ms cubic-bezier(0.2, 0, 0, 1);
    --font-body: 'Roboto Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Real damped-spring physics where linear() is supported (the beziers above
     are the fallback). Curves are sampled from a simulated spring, mass 1:
     wobble = stiffness 320, damping ratio 0.62 (~8% overshoot, settles 632ms);
     snap = stiffness 700, damping ratio 0.85 (near-critical, settles 370ms).
     Same parameterization M3 Expressive uses for its spatial springs. */
  @supports (transition-timing-function: linear(0, 0.5, 1)) {
    :root {
      --motion-wobble: 632ms linear(0.0003, 0.0924 4.0%, 0.2917 8.0%, 0.5096 12.0%, 0.7087 16.0%, 0.8667 20.0%, 0.9806 24.0%, 1.0455 28.0%, 1.0756 32.0%, 1.0812 36.0%, 1.0716 40.0%, 1.0553 44.0%, 1.0375 48.0%, 1.0211 52.0%, 1.0089 56.0%, 1.0006 60.0%, 0.9958 64.0%, 0.9936 68.0%, 0.9934 72.0%, 0.9943 76.0%, 0.9958 80.0%, 0.9972 84.0%, 0.9984 88.0%, 0.9994 92.0%, 1 96.0%, 1.0004);
      --motion-snap: 370ms linear(0.0007, 0.0756 4.0%, 0.2194 8.0%, 0.3704 12.0%, 0.5238 16.0%, 0.6553 20.0%, 0.7609 24.0%, 0.8413 28.0%, 0.8965 32.0%, 0.9384 36.0%, 0.9665 40.0%, 0.9844 44.0%, 0.9952 48.0%, 1.0009 52.0%, 1.0039 56.0%, 1.005 60.0%, 1.0049 64.0%, 1.0043 68.0%, 1.0036 72.0%, 1.0028 76.0%, 1.0021 80.0%, 1.0015 84.0%, 1.001 88.0%, 1.0007 92.0%, 1.0004 96.0%, 1.0002);
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --semantic-income: #2ECC71;
      --semantic-expense: #FF4D4D;
      --primary: #F8F9FA;
      --on-primary: #212529;
      --primary-container: #2B3035;
      --on-primary-container: #F8F9FA;
      --surface: #121212;
      --surface-container-low: #1E1E1E;
      --surface-container: #2D2D2D;
      --surface-container-high: #3D3D3D;
      --outline: #ADB5BD;
      --outline-variant: #2D2D2D;
      --on-surface: #F8F9FA;
      --on-surface-variant: #CED4DA;
      --wash-income: rgba(46, 204, 113, 0.06);
      --wash-expense: rgba(255, 77, 77, 0.06);
      --wash-hero: rgba(248, 249, 250, 0.04);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body { 
    font-family: var(--font-body);
    font-variation-settings: 'wght' 400, 'wdth' 100;
    background: var(--surface); 
    color: var(--on-surface); 
    min-height: 100vh; 
    padding-bottom: 115px; 
  }

  .header { 
    background: var(--surface-container-low); 
    padding: 1.25rem 1.5rem; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    border-bottom: 1px solid var(--outline-variant); 
  }
  
  .header-title { 
    font-size: 20px; 
    font-weight: 800; 
    font-variation-settings: 'wght' 700, 'wdth' 105; 
    color: var(--on-surface); 
    letter-spacing: -0.4px; 
  }
  
  .month-select { 
    font-size: 13px; 
    padding: 5px 10px; 
    border-radius: var(--shape-sm); 
    border: 1px solid var(--outline-variant); 
    background: var(--surface-container-low); 
    color: var(--on-surface); 
    cursor: pointer; 
    font-weight: 600; 
    outline: none; 
  }
  
  .header-actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--shape-full);
    border: 1px solid var(--outline-variant);
    background: transparent;
    color: var(--on-surface-variant);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--motion-standard), transform var(--motion-snap);
    padding: 0;
    outline: none;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-container); }
  .export-btn:active { transform: scale(0.9); }

  /* Refresh spins while a fetch is actually in flight — feedback, not decoration. */
  @keyframes refreshSpin { to { transform: rotate(360deg); } }
  .refresh-btn.spinning svg { animation: refreshSpin 0.7s linear infinite; }

  .bottom-bar {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  .floating-nav { 
    position: relative;
    background: rgba(255, 255, 255, 0.75);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.08); 
    border-radius: var(--shape-full); 
    display: flex; 
    align-items: center; 
    padding: 4px; 
    box-shadow: 0 12px 32px rgba(0,0,0,0.06), inset 0 1px 1px rgba(255,255,255,0.8);
    width: 230px; 
    height: 48px; 
  }
  
  @media (prefers-color-scheme: dark) {
    .floating-nav {
      background: rgba(30, 30, 30, 0.75);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
  }
  
  .nav-btn { 
    flex: 1; 
    border: none; 
    background: transparent; 
    color: var(--on-surface-variant); 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    height: 100%; 
    z-index: 2; 
    outline: none; 
    transition: color var(--motion-standard);
  }
  .nav-btn.active { color: var(--on-primary); font-weight: 700; }
  
  .nav-slider { 
    position: absolute; 
    top: 4px; 
    bottom: 4px; 
    left: 4px; 
    width: calc(50% - 4px); 
    background: var(--primary);
    border-radius: var(--shape-full); 
    transition: transform var(--motion-wobble); 
    z-index: 1; 
    pointer-events: none; 
  }

  .fab {
    width: 48px;
    height: 48px;
    border-radius: var(--shape-full);
    background: var(--primary);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    color: var(--surface-container-low);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    cursor: pointer;
    flex-shrink: 0;
    outline: none;
    transition: transform var(--motion-snap);
  }
  .fab svg {
    transition: transform var(--motion-wobble);
    transform-origin: center;
  }
  .fab:active { transform: scale(0.9); }
  body.modal-open-state .fab svg { transform: rotate(135deg); }

  /* overflow-x: clip contains the shared-axis slide's transient translateX so
     it never widens the document. Without it, that momentary horizontal
     overflow makes position:fixed; right:0 bars (nav, modals) size to the
     widened layout viewport and *sustain* the overflow — which a mobile
     browser then zooms to fit ("page zooms in slightly after a few toggles").
     clip (not hidden) keeps overflow-y visible, so vertical page scroll and
     the sticky header are unaffected. */
  .container { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; overflow-x: clip; }
  .view-section { display: none; }
  .view-section.active { display: block; }

  /* M3 shared-axis: the incoming view springs in along X, direction matching
     tab order (Home ← → Analytics), so the pill and content move as one
     connected mechanism. */
  @keyframes axisInLeft {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes axisInRight {
    from { opacity: 0; transform: translateX(-32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .view-section.axis-in-left { animation: axisInLeft var(--motion-snap) both; }
  .view-section.axis-in-right { animation: axisInRight var(--motion-snap) both; }

  /* Revisiting a tab restarts child CSS animations (display:none → block
     resets them); .settled pins already-seen content so only the section's
     own axis slide plays. */
  .view-section.settled .hero-card, .view-section.settled .tile-block,
  .view-section.settled .txn-row, .view-section.settled .txn-icon-chip { animation: none; }

  @media (max-width: 480px) {
    .tile-row {
      max-width: 440px;
      margin: 0 auto 1.5rem auto;
    }
  }

  /* ────────────────────────────────────────────────────────────
     HOME HERO CARD — always ink-black, independent of light/dark theme
     ──────────────────────────────────────────────────────────── */
  @keyframes heroPopIn {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes tilePopIn {
    from { opacity: 0; transform: scale(0.9) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes chipPop {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero-card {
    background: var(--surface-container-low);
    color: var(--on-surface);
    border-radius: var(--shape-xl) var(--shape-xs) var(--shape-xl) var(--shape-xs);
    border: 1px solid var(--outline-variant);
    padding: 1.5rem 1.5rem 1.1rem;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    animation: heroPopIn var(--motion-wobble) backwards;
  }
  @media (prefers-color-scheme: dark) {
    .hero-card {
      background: linear-gradient(155deg, #24262B 0%, #0B0C0E 100%);
      color: #F5F5F2;
      border-color: rgba(255,255,255,0.1);
    }
  }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .hero-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-variant); }
  .hero-amount {
    font-size: 36px; font-weight: 900;
    font-variation-settings: 'wght' 850, 'wdth' 80;
    letter-spacing: -1px; line-height: 1.1; margin: 6px 0 2px;
  }
  .hero-sub { font-size: 11px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 14px; }
  .hero-chart-wrap { position: relative; width: 100%; height: 58px; margin: 0 -4px; }

  .tile-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 1.5rem; width: 100%; }
  /* Analytics tile row sits directly above the spend-pace card, same
     pairing as the home hero card + income/expense tiles — keep both
     gaps at the hero card's 12px instead of the section-break 1.5rem. */
  #analytics-metrics { margin-bottom: 12px; }
  #income-bar-card { margin-bottom: 12px; }

  .tile-block {
    min-width: 0;
    border-radius: var(--shape-lg);
    border: 1px solid var(--outline-variant);
    padding: 1rem 1.1rem;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 104px;
    justify-content: center;
    cursor: default;
    animation: tilePopIn var(--motion-wobble) backwards;
    transition: transform var(--motion-snap);
  }
  .tile-block:active { transform: scale(0.97); }
  /* Entrance cascade: hero lands first, then the tiles follow one by one.
     `backwards` fill keeps delayed elements hidden until their turn. */
  .tile-row .tile-block:nth-child(1) { animation-delay: 70ms; }
  .tile-row .tile-block:nth-child(2) { animation-delay: 140ms; }
  /* A view re-render with the same layout (month switch, post-save refresh)
     should update values, not replay the pop-in ceremony. */
  .no-entrance .hero-card, .no-entrance .tile-block { animation: none; }
  .tile-block.income-block { background: var(--wash-income); }
  .tile-block.expense-block { background: var(--wash-expense); }
  .tile-block.neutral-block { background: var(--surface-container); }
  .tile-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-variant); }
  .tile-val { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
  .tile-block.income-block .tile-val { color: var(--semantic-income); }
  .tile-block.expense-block .tile-val { color: var(--semantic-expense); }
  .tile-block.neutral-block .tile-val { color: var(--on-surface); }
  .tile-chip {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: var(--shape-full); border: 1px solid; background: transparent;
    width: fit-content;
  }
  /* Chip color follows valence (good/bad news), not which tile it sits on —
     expenses dropping is good news and should read green. */
  .tile-chip.good { color: var(--semantic-income); border-color: var(--semantic-income); }
  .tile-chip.bad { color: var(--semantic-expense); border-color: var(--semantic-expense); }

  .txn-icon-chip {
    width: 36px; height: 36px; border-radius: var(--shape-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    animation: chipPop var(--motion-wobble) backwards;
    animation-delay: var(--d, 0ms);
  }

  .charts-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    margin-bottom: 1.5rem;
    width: 100%;
  }
  /* minmax(0, ..) stops a grid item's intrinsic content (canvas, nowrap legend
     text) from blowing out past its track's width and drifting off-center. */
  .charts-row > .card { min-width: 0; }

  @media (max-width: 768px) {
    .charts-row { grid-template-columns: minmax(0, 1fr); }
    /* Every analytics block shares one width + centering so nothing drifts. */
    #analytics-view > * {
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
  }

  .card { background: var(--surface-container-low); border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); padding: 1.25rem; width: 100%; display: flex; flex-direction: column; }

  /* Analytics insight strip — a short narrative "what I noticed" note,
     computed deterministically in JS (Phase 1; an LLM phrasing layer slots
     in later). Numbers are bolded; the whole thing is calm and glanceable. */
  .insight-card {
    background: var(--surface-container-low);
    border: 1px solid var(--outline-variant);
    border-radius: var(--shape-lg) var(--shape-xs) var(--shape-lg) var(--shape-xs);
    padding: 1.1rem 1.25rem;
    margin-bottom: 12px;
    width: 100%;
  }
  .insight-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .insight-head svg { flex-shrink: 0; }
  .insight-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-variant); }
  .insight-body { font-size: 13.5px; line-height: 1.55; color: var(--on-surface); font-weight: 500; }
  .insight-body b { font-weight: 800; }
  .insight-body .up { color: var(--semantic-expense); font-weight: 800; }
  .insight-body .down { color: var(--semantic-income); font-weight: 800; }
  
  .card-title { font-size: 11px; font-weight: 700; margin-bottom: 14px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; }

  .income-bar-caption { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin: 0 0 22px; }
  .income-bar-caption b { color: var(--on-surface); font-weight: 800; }
  .income-bar-caption .cap-period { font-size: 11px; font-weight: 600; color: var(--on-surface-variant); white-space: nowrap; }

  .income-bar-wrap { position: relative; }
  .income-bar-row { display: flex; gap: 6px; }
  .income-bar-seg {
    border-radius: var(--shape-full);
    padding: 10px 14px;
    font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap; overflow: hidden;
    transition: flex-grow var(--motion-wobble);
    min-width: 4px;
  }
  .income-bar-seg.used { background: var(--semantic-expense); color: #fff; justify-content: flex-start; }
  .income-bar-seg.rem { background: var(--surface-container); color: var(--on-surface); }

  /* "Today" marker overlaid on the bar at the month-elapsed position;
     springs from 0 to its position alongside the segments' flex-grow spring
     (both start values are set in markup, finals applied a frame later). */
  .income-bar-marker { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--on-surface); border-radius: 2px; transform: translateX(-1px); pointer-events: none; transition: left var(--motion-wobble); }
  .income-bar-marker::before {
    content: attr(data-label);
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase;
    color: var(--on-surface); white-space: nowrap;
  }
  .income-bar-pace { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-top: 14px; }
  .income-bar-pace b { font-weight: 800; }
  .income-bar-pace b.ahead { color: var(--semantic-expense); }
  .income-bar-pace b.under { color: var(--semantic-income); }

  .custom-pill-legend { display: flex; gap: 12px; justify-content: center; margin-top: 10px; width: 100%; }
  .pill-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 12px; border-radius: var(--shape-full); border: 1px solid var(--outline-variant); background: var(--surface-container-low); }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; }
  /* Matches the "This Month" line color the chart JS picks per theme —
     the old hardcoded #1A1A1A dot was invisible on the dark card. */
  .pill-dot-this { background: #1A1A1A; }
  /* Last month is a reference, not a warning — outline gray, matching the
     dashed line color the chart JS picks per theme. */
  .pill-dot-last { background: #6C757D; }
  @media (prefers-color-scheme: dark) {
    .pill-dot-this { background: #F8F9FA; }
    .pill-dot-last { background: #ADB5BD; }
  }

  .date-group-header { font-size: 11px; font-weight: 700; color: var(--on-surface-variant); margin: 1.5rem 0 0.5rem 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .txn-list { border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); background: var(--surface-container-low); overflow: hidden; margin-bottom: 0.5rem; }
  
  .txn-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 12px 1.25rem; 
    border-bottom: 1px solid var(--outline-variant); 
    cursor: pointer;
    background: transparent;
    transition: background-color var(--motion-snap), transform var(--motion-snap);
    outline: none;
    animation: rowIn var(--motion-snap) backwards;
    animation-delay: var(--d, 0ms);
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-row:hover { background: rgba(0, 0, 0, 0.02); }
  .txn-row:active { background: rgba(0, 0, 0, 0.05); transform: scale(0.985); }
  
  @media (prefers-color-scheme: dark) {
    .txn-row:hover { background: rgba(255, 255, 255, 0.02); }
    .txn-row:active { background: rgba(255, 255, 255, 0.05); }
  }
  
  .txn-left { display: flex; align-items: center; gap: 12px; }
  .txn-details { display: flex; flex-direction: column; gap: 2px; }
  .txn-badge-container { display: flex; margin-top: 1px; }

  .txn-footer {
    background: var(--surface-container);
    padding: 11px 1.25rem 11px 1.45rem; 
    position: relative; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-surface); 
    border-top: 1px solid var(--outline-variant);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .txn-footer::before {
    content: '';
    position: absolute;
    left: 10px; 
    top: 8px;   
    bottom: 8px;
    width: 3px;
    background-color: var(--semantic-expense); 
    border-radius: var(--shape-xs); 
  }
  .txn-footer-amt {
    color: var(--semantic-expense); 
    font-size: 13.5px;
    font-weight: 700;
  }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; color: var(--on-surface-variant); font-size: 14px; }

  /* Loader: a bouncing mini bar-chart — Alfred's own data, warming up.
     Last bar wears the burnt-sienna accent, same as the hero chart's
     current-month bar. */
  .loader-bars { display: flex; align-items: flex-end; gap: 5px; height: 34px; margin-bottom: 16px; }

    width: 8px; height: 100%; border-radius: 4px;

  .loader-bars span:nth-child(2) { animation-delay: 120ms; }
  .loader-bars span:nth-child(3) { animation-delay: 240ms; }
  .loader-bars span:nth-child(4) { animation-delay: 360ms; background: #C2542D; }
  @keyframes loaderBounce {
    0%, 100% { transform: scaleY(0.25); }
    50% { transform: scaleY(1); }
  }
  @keyframes loaderPulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25); 
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    display: flex;
    align-items: center;

    opacity: 1; 
    pointer-events: auto;
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);

  .modal-sheet {
    background: var(--surface-container-low);

  }
  .modal-title { 
    font-size: 18px;

  .type-toggle {

    transition: transform var(--motion-snap);

  .btn-danger-solid { flex: 1; background: var(--semantic-expense); color: #fff; }
  .btn-danger-solid:disabled { opacity: 0.5; }

  /* In-modal delete confirmation — replaces native confirm() so the
     liquid-glass sheet stays intact at the most destructive moment. */
  .modal-confirm { display: none; margin-top: 1.5rem; }
  .modal-confirm.show { display: block; animation: confirmIn var(--motion-snap) both; }

  .modal-confirm-text b { font-weight: 800; }

  @keyframes confirmIn {
    from { opacity: 0; transform: translateY(6px); }

  .modal-error {

  .export-choice {

  /* Zeroing the motion tokens collapses every transition/animation that uses

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
const SHEET_ID = "19_C3gFlY7hDjGm87k3Uke63_Tgg6TQPl6xLiGZvuEis";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxRLfHCAbCspXIWSRt1xVAbLnNPlhiHHaWpTHGB23N1wkoMU74nHifMT9prU3rM4m6/exec";
const SECRET_KEY = "8891";

const INCOME_CATEGORIES = ["Salary", "Freelance", "Bonus", "Investment", "Side Income", "Reimbursement", "Other Income"];
const EXPENSE_CATEGORIES = ["Food & Dining", "Transport", "Bills & Utilities", "Shopping", "Groceries", "Entertainment", "Other"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Parse User ID from URL
const urlParams = new URLSearchParams(window.location.search);
let activeUser = urlParams.get('user') || '';

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let allRows = [];
let activeMonth = new Date().getMonth();
let activeYear = new Date().getFullYear();
let currentView = 'home';

// Render-state tracking so revisiting a tab doesn't rebuild (and re-animate)
// content that is already current. dataStamp bumps on every sheet fetch;
// renderedKey remembers what month+data each view last rendered.
let dataStamp = 0;
const renderedKey = { home: null, analytics: null };
const hasEntranced = { home: false, analytics: false };
// Last value each counter displayed, so numbers animate from where they
// were (value inertia) instead of re-counting from zero on every render.
const counterMemory = {};
// Same idea for the spend bar: segments + Today marker spring from their
// previous position (or from empty on first render) to the new one.
let barMemory = null;

let donutChart = null;
let lineChart = null;
let heroChart = null;

const CAT_ICONS = {
  "Food & Dining": "🍜",
  "Transport": "🚗",
  "Bills & Utilities": "💡",
  "Shopping": "🛍️",
  "Groceries": "🛒",
  "Entertainment": "🎬",
  "Other": "📎"
};

function formatCurrency(num) {
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function monthTotals(year, month) {
  const monthRows = allRows.filter(r => {
    const d = new Date(r.Date);
    return d.getMonth() === month && d.getFullYear() === year && (activeUser ? r.User === activeUser : false);
  });
  const inc = monthRows.filter(r => r.Type === "Income").reduce((s, r) => s + r.Amount, 0);
  const exp = monthRows.filter(r => r.Type !== "Income").reduce((s, r) => s + r.Amount, 0);
  return { inc, exp, net: inc - exp };
}

// ── Insights engine (Phase 1: deterministic) ───────────────────────────────
// Scans the active user's rows and builds a short narrative of notable
// patterns across four families: pace/anomaly, category trends, timing/habits,
// and recurring charges. Every number is computed here (never guessed) — a
// later phase can hand these same facts to an LLM purely for nicer phrasing.
function _shiftMonth(year, month, delta) {
  const d = new Date(year, month + delta, 1);
  return { year: d.getFullYear(), month: d.getMonth() };
}
function _userExpenseRows() {
  return allRows.filter(r => r.Type !== 'Income' && (activeUser ? r.User === activeUser : false));
}
function _expenseRowsFor(year, month) {
  return _userExpenseRows().filter(r => {
    const d = new Date(r.Date);
    return d.getMonth() === month && d.getFullYear() === year;
  });
}
function _sum(rows) { return rows.reduce((s, r) => s + r.Amount, 0); }
function _rm(n) { return 'RM ' + formatCurrency(n); }

// Pace: this month vs the same point last month (current month), or the whole
// month vs the one before (past months).
function _insightPace() {
  const today = new Date();
  const isCurrent = activeMonth === today.getMonth() && activeYear === today.getFullYear();
  const lastM = _shiftMonth(activeYear, activeMonth, -1);
  if (isCurrent) {
    const dEl = today.getDate();
    const mtd = _sum(_expenseRowsFor(activeYear, activeMonth));
    const lastWin = _sum(_expenseRowsFor(lastM.year, lastM.month).filter(r => new Date(r.Date).getDate() <= dEl));
    if (mtd < 1 || lastWin < 1) return null;
    const pct = (mtd - lastWin) / lastWin;
    if (Math.abs(pct) < 0.12) return null;
    const faster = pct > 0;
    return {
      family: 'pace', score: 40 + Math.min(Math.abs(pct), 1.5) * 60,
      text: `You're spending a little ${faster ? 'faster' : 'slower'} than last month — <b>${_rm(mtd)}</b> so far versus <b>${_rm(lastWin)}</b> at this point in ${MONTHS[lastM.month]}.`
    };
  }
  const cur = _sum(_expenseRowsFor(activeYear, activeMonth));
  const prev = _sum(_expenseRowsFor(lastM.year, lastM.month));
  if (cur < 1 || prev < 1) return null;
  const pct = (cur - prev) / prev;
  if (Math.abs(pct) < 0.12) return null;
  const up = pct > 0;
  return {
    family: 'pace', score: 40 + Math.min(Math.abs(pct), 1.5) * 60,
    text: `In ${MONTHS[activeMonth]} you spent <b>${_rm(cur)}</b>, <span class="${up ? 'up' : 'down'}">${up ? 'up' : 'down'} ${Math.abs(pct * 100).toFixed(0)}%</span> from ${MONTHS[lastM.month]}.`
  };
}

// Category trends: a 3-month monotonic climb, or a sharp jump vs recent average.
function _insightCategory() {
  const m1 = _shiftMonth(activeYear, activeMonth, -1);
  const m2 = _shiftMonth(activeYear, activeMonth, -2);
  const cats = {};
  _expenseRowsFor(activeYear, activeMonth).forEach(r => { cats[r.Category] = true; });
  let best = null;
  Object.keys(cats).forEach(cat => {
    const c0 = _sum(_expenseRowsFor(activeYear, activeMonth).filter(r => r.Category === cat));
    const c1 = _sum(_expenseRowsFor(m1.year, m1.month).filter(r => r.Category === cat));
    const c2 = _sum(_expenseRowsFor(m2.year, m2.month).filter(r => r.Category === cat));
    if (c0 < 30) return;
    const short = cat.split(' ')[0];
    // 3-month climb
    if (c2 > 0 && c1 > c2 && c0 > c1) {
      const climb = (c0 - c2) / c2;
      const score = 50 + Math.min(climb, 2) * 30;
      if (!best || score > best.score) best = { family: 'category', score,
        text: `${short}: <b>${_rm(c2)} → ${_rm(c1)} → ${_rm(c0)}</b> — climbing three months straight.` };
    } else if (c1 > 0 || c2 > 0) {
      // jump vs recent average
      const base = (c1 + c2) / ((c1 > 0 ? 1 : 0) + (c2 > 0 ? 1 : 0) || 1);
      if (base > 0) {
        const jump = (c0 - base) / base;
        if (jump >= 0.4) {
          const score = 45 + Math.min(jump, 2) * 25;
          if (!best || score > best.score) best = { family: 'category', score,
            text: `${short} jumped to <b>${_rm(c0)}</b> this month, <span class="up">up ${(jump * 100).toFixed(0)}%</span> from its recent average.` };
        } else if (jump <= -0.4) {
          const score = 42;
          if (!best || score > best.score) best = { family: 'category', score,
            text: `${short} eased to <b>${_rm(c0)}</b>, <span class="down">down ${Math.abs(jump * 100).toFixed(0)}%</span> from its recent average.` };
        }
      }
    }
  });
  return best;
}

// Composition: the dominant category's share this month (filler / context).
function _insightComposition() {
  const rows = _expenseRowsFor(activeYear, activeMonth);
  const total = _sum(rows);
  if (total < 1) return null;
  const cats = {};
  rows.forEach(r => { cats[r.Category] = (cats[r.Category] || 0) + r.Amount; });
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
  const share = top[1] / total;
  if (share < 0.35) return null;
  return { family: 'composition', score: 20 + share * 20,
    text: `${top[0].split(' ')[0]} is your biggest slice at <b>${(share * 100).toFixed(0)}%</b> of the month.` };
}

// Timing: weekend vs weekday intensity over the trailing 8 weeks.
function _insightWeekend() {
  const today = new Date();
  const isCurrent = activeMonth === today.getMonth() && activeYear === today.getFullYear();
  const end = isCurrent ? today : new Date(activeYear, activeMonth + 1, 0);
  const start = new Date(end); start.setDate(end.getDate() - 55);
  const rows = _userExpenseRows().filter(r => { const d = new Date(r.Date); return d >= start && d <= end; });
  if (rows.length < 8) return null;
  let weSum = 0, wdSum = 0;
  rows.forEach(r => { const g = new Date(r.Date).getDay(); (g === 0 || g === 6 ? (weSum += r.Amount) : (wdSum += r.Amount)); });
  // 8 weeks ≈ 16 weekend days, 40 weekday days
  const weAvg = weSum / 16, wdAvg = wdSum / 40;
  if (weAvg < 1 || wdAvg < 1) return null;
  const ratio = weAvg / wdAvg;
  if (ratio >= 1.4) return { family: 'timing', score: 30 + Math.min(ratio - 1, 2) * 15,
    text: `Weekends run about <b>${ratio.toFixed(1)}×</b> heavier than weekdays for you.` };
  if (ratio <= 0.6) return { family: 'timing', score: 30,
    text: `You keep it light on weekends — about <b>${Math.round((1 / ratio))}×</b> more goes out on weekdays.` };
  return null;
}

// Timing: longest no-spend streak within the selected month so far.
function _insightStreak() {
  const today = new Date();
  const isCurrent = activeMonth === today.getMonth() && activeYear === today.getFullYear();
  const lastDay = isCurrent ? today.getDate() : new Date(activeYear, activeMonth + 1, 0).getDate();
  const spendDays = new Set(_expenseRowsFor(activeYear, activeMonth).map(r => new Date(r.Date).getDate()));
  if (!spendDays.size) return null;
  let best = 0, run = 0;
  for (let d = 1; d <= lastDay; d++) { if (spendDays.has(d)) run = 0; else { run++; best = Math.max(best, run); } }
  if (best < 3) return null;
  return { family: 'timing', score: 25 + best * 2,
    text: `You strung together <b>${best}</b> no-spend days${isCurrent ? ' this month' : ''}.` };
}

// Recurring: descriptions that repeat ~once a month across ≥3 months at a
// stable amount — subscriptions, bills. Reports the aggregate monthly load.
function _insightRecurring() {
  const groups = {};
  _userExpenseRows().forEach(r => {
    const key = (r.Description || '').trim().toLowerCase();
    if (!key || key === 'unlabeled') return;
    const d = new Date(r.Date);
    (groups[key] = groups[key] || []).push({ ym: d.getFullYear() * 12 + d.getMonth(), amount: r.Amount, label: r.Description.trim() });
  });
  const recurring = [];
  Object.values(groups).forEach(items => {
    const months = new Set(items.map(i => i.ym));
    if (months.size < 3) return;
    if (items.length > months.size * 1.5) return; // filter frequent variable spend (e.g. "lunch")
    const amts = items.map(i => i.amount);
    const mean = amts.reduce((a, b) => a + b, 0) / amts.length;
    if (mean < 3) return;
    const sd = Math.sqrt(amts.reduce((a, b) => a + (b - mean) ** 2, 0) / amts.length);
    if (sd / mean > 0.2) return; // amounts must be stable
    recurring.push({ label: items[0].label, monthly: mean });
  });
  if (!recurring.length) return null;
  recurring.sort((a, b) => b.monthly - a.monthly);
  const totalMonthly = recurring.reduce((s, r) => s + r.monthly, 0);
  if (recurring.length === 1) {
    const r = recurring[0];
    return { family: 'recurring', score: 35 + Math.min(r.monthly / 100, 1) * 15,
      text: `<b>${_rm(r.monthly)}</b> a month quietly goes to “${r.label}” — about <b>${_rm(r.monthly * 12)}</b> a year.` };
  }
  return { family: 'recurring', score: 38 + Math.min(totalMonthly / 300, 1) * 15,
    text: `<b>${_rm(totalMonthly)}</b> a month goes to <b>${recurring.length}</b> recurring charges — roughly <b>${_rm(totalMonthly * 12)}</b> a year.` };
}

function buildAnalyticsInsight() {
  const sparkle = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#C2542D"><path d="M12 2l1.9 6.3L20 10l-6.1 1.7L12 18l-1.9-6.3L4 10l6.1-1.7z"/></svg>';
  const head = `<div class="insight-head">${sparkle}<span class="insight-label">What I noticed</span></div>`;
  const wrap = body => `<div class="insight-card">${head}<div class="insight-body">${body}</div></div>`;

  if (_userExpenseRows().length < 5) {
    return wrap(`Not much to go on yet — log a few more days and patterns will start to surface here.`);
  }

  const candidates = [
    _insightPace(), _insightCategory(), _insightRecurring(),
    _insightWeekend(), _insightStreak(), _insightComposition()
  ].filter(Boolean).sort((a, b) => b.score - a.score);

  const picked = [];
  const usedFamilies = new Set();
  for (const c of candidates) {
    if (usedFamilies.has(c.family)) continue;
    usedFamilies.add(c.family);
    picked.push(c);
    if (picked.length === 3) break;
  }
  if (!picked.length) {
    return wrap(`A steady month — nothing unusual jumping out of your spending just yet.`);
  }
  return wrap(picked.map(p => p.text).join(' '));
}

// Wrap a field in quotes only when it contains a comma, quote or newline;
// embedded quotes are doubled per RFC 4180 so descriptions never break a row.
function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(scope) {
  const errEl = document.getElementById('export-error');
  errEl.style.display = 'none';

  // Privacy: only ever serialize the active user's own rows.
  let rows = allRows.filter(r => activeUser ? r.User === activeUser : false);
  if (scope === 'month') {
    rows = rows.filter(r => {
      const d = new Date(r.Date);
      return d.getMonth() === activeMonth && d.getFullYear() === activeYear;
    });
  }
  rows.sort((a, b) => new Date(a.Date) - new Date(b.Date));

  if (!rows.length) {
    errEl.textContent = scope === 'month'
      ? `No transactions logged for ${MONTHS[activeMonth]} ${activeYear}.`
      : 'No transactions to export yet.';
    errEl.style.display = 'block';
    return;
  }

  const headers = ['Date', 'Type', 'Category', 'Description', 'Amount'];
  const lines = [headers.join(',')];
  for (const r of rows) {
    lines.push([
      csvEscape(r.Date),
      csvEscape(r.Type),
      csvEscape(r.Category),
      csvEscape(r.Description),
      csvEscape(r.Amount.toFixed(2))
    ].join(','));
  }
  const csv = lines.join('\r\n');

  const scopeTag = scope === 'month'
    ? `${MONTHS[activeMonth].toLowerCase()}-${activeYear}`
    : 'all-transactions';
  triggerDownload(csv, `alfred-${scopeTag}.csv`);
  closeExportModal();
}

function triggerDownload(text, filename) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const pieLabelsPlugin = {
  id: 'pieLabels',
  afterDatasetsDraw: (chart) => {
    if (chart.canvas.id !== 'donut') return;
    const meta = chart.getDatasetMeta(0);
    const dataset = chart.data.datasets[0];
    if (!meta.data.length) return;
    const total = dataset.data.reduce((a, b) => a + b, 0);
    if (!total) return;

    const { ctx } = chart;
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    // Bold % centered inside the slice — only where it's wide enough to hold it.
    meta.data.forEach((arc, i) => {
      const pct = (dataset.data[i] / total) * 100;
      if (pct < 8) return;
      const pos = arc.tooltipPosition();
      ctx.save();
      ctx.font = '800 13px -apple-system, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 3;
      ctx.fillText(Math.round(pct) + '%', pos.x, pos.y);
      ctx.restore();
    });

    // Every slice gets a name + amount callout (tooltips are disabled, so
    // this is the only way to identify small categories). Callouts route to
    // a left or right column by slice angle, then get pushed apart
    // vertically so clustered thin slices never overlap.
    const sides = { left: [], right: [] };
    meta.data.forEach((arc, i) => {
      const angle = (arc.startAngle + arc.endAngle) / 2;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      sides[cos >= 0 ? 'right' : 'left'].push({
        i, cos,
        edgeX: arc.x + cos * arc.outerRadius,
        edgeY: arc.y + sin * arc.outerRadius,
        y: arc.y + sin * (arc.outerRadius + 16)
      });
    });

    const minGap = 32; // two-line text block is ~30px tall
    for (const side of ['left', 'right']) {
      const items = sides[side].sort((a, b) => a.y - b.y);
      for (let k = 1; k < items.length; k++)
        if (items[k].y < items[k - 1].y + minGap) items[k].y = items[k - 1].y + minGap;
      // Keep the stack on-canvas: shift up if it ran off the bottom, then
      // clamp the top and re-space downward.
      if (items.length) {
        const overflow = items[items.length - 1].y + 16 - chart.height;
        if (overflow > 0) items.forEach(it => { it.y -= overflow; });
        items[0].y = Math.max(items[0].y, 18);
        for (let k = 1; k < items.length; k++)
          if (items[k].y < items[k - 1].y + minGap) items[k].y = items[k - 1].y + minGap;
      }

      for (const it of items) {
        const right = side === 'right';
        const hx = right ? chart.chartArea.right + 40 : chart.chartArea.left - 40;
        const name = chart.data.labels[it.i].split(' ')[0];
        const amt = 'RM ' + formatCurrency(dataset.data[it.i]);

        ctx.save();
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;

        // One straight segment from slice edge to just short of the text.
        // Anchors and labels share the same top-to-bottom order (both follow
        // slice angle, and de-collision preserves it), so straight leaders
        // can never cross — the old radial-stub elbow could, when adjacent
        // small slices had their labels pushed apart.
        ctx.font = '800 11.5px -apple-system, sans-serif';
        const nameW = ctx.measureText(name).width;
        ctx.font = '600 10px -apple-system, sans-serif';
        const blockW = Math.max(nameW, ctx.measureText(amt).width);
        const lineEndX = right ? hx - blockW - 6 : hx + blockW + 6;

        ctx.beginPath();
        ctx.moveTo(it.edgeX, it.edgeY);
        ctx.lineTo(lineEndX, it.y);
        ctx.stroke();

        ctx.textAlign = right ? 'right' : 'left';
        ctx.font = '800 11.5px -apple-system, sans-serif';
        ctx.fillStyle = isDark ? '#F8F9FA' : '#212529';
        ctx.fillText(name, hx, it.y - 3);
        ctx.font = '600 10px -apple-system, sans-serif';
        ctx.fillStyle = isDark ? '#ADB5BD' : '#6C757D';
        ctx.fillText(amt, hx, it.y + 12);
        ctx.restore();
      }
    }
  }
};
// Scale each slice's outer radius slightly by its share of the largest
// category — just enough to hint at hierarchy without an ungainly lopsided
// circle when one category (usually Food) dominates.
// Runs every draw frame so the values never compound.
const variableRadiusPlugin = {
  id: 'variableRadius',
  beforeDatasetsDraw: (chart) => {
    if (chart.canvas.id !== 'donut') return;
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0].data;
    if (!meta.data.length) return;
    const maxVal = Math.max(...data);
    if (!maxVal) return;
    const base = meta.controller.outerRadius;
    meta.data.forEach((arc, i) => {
      arc.outerRadius = base * (0.92 + 0.08 * (data[i] / maxVal));
    });
  }
};
// Faint zero line behind the hero trend bars so negative months read as
// "below the line" instead of vanishing (paired with minBarLength on the
// dataset, which guarantees every month at least a visible sliver).
const heroBaselinePlugin = {
  id: 'heroBaseline',
  beforeDatasetsDraw: (chart) => {
    if (chart.canvas.id !== 'hero-trend') return;
    const yScale = chart.scales.y;
    if (!yScale) return;
    const y = yScale.getPixelForValue(0);
    const { ctx, chartArea } = chart;
    if (y < chartArea.top || y > chartArea.bottom) return;
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.save();
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(chartArea.left, y + 0.5);
    ctx.lineTo(chartArea.right, y + 0.5);
    ctx.stroke();
    ctx.restore();
  }
};
Chart.register(variableRadiusPlugin, pieLabelsPlugin, heroBaselinePlugin);
if (REDUCED_MOTION) Chart.defaults.animation = false;

function animateCounters() {
  document.querySelectorAll('.counter-val').forEach(counter => {
    const target = parseFloat(counter.getAttribute('data-val')) || 0;
    const prefix = counter.getAttribute('data-prefix') || "";
    const suffix = counter.getAttribute('data-suffix') || "";
    const key = counter.getAttribute('data-key');
    const from = (key && key in counterMemory) ? counterMemory[key] : 0;
    if (key) counterMemory[key] = target;

    if (REDUCED_MOTION || from === target) {
      counter.innerHTML = prefix + formatCurrency(target) + suffix;
      return;
    }
    counter.innerHTML = prefix + formatCurrency(from) + suffix;

    const duration = 1200;
    let startTimestamp = null;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      const currentVal = from + (target - from) * easeOut;
      counter.innerHTML = prefix + formatCurrency(currentVal) + suffix;
      if (progress < 1) window.requestAnimationFrame(step);
      else counter.innerHTML = prefix + formatCurrency(target) + suffix;
    };
    window.requestAnimationFrame(step);
  });
}

async function init() {
  const refreshBtn = document.querySelector('.refresh-btn');
  refreshBtn.classList.add('spinning');
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const text = await res.text();
    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const json = JSON.parse(jsonString);
    
    allRows = json.table.rows
      .filter(r => r.c && r.c[0]?.v && r.c[1]?.v) 
      .map(r => {
        let rawDate = r.c[0].v;
        let formattedDate = "";
        if (typeof rawDate === 'string' && rawDate.includes('Date')) {
          const dateParts = rawDate.replace("Date(", "").replace(")", "").split(",");
          formattedDate = `${dateParts[0]}-${String(Number(dateParts[1]) + 1).padStart(2, "0")}-${String(dateParts[2]).padStart(2, "0")}`;
        } else {
          formattedDate = String(rawDate).replace(/^'/, ""); 
        }
        return {
          Date: formattedDate,
          Amount: Number(r.c[1].v),
          Category: r.c[2]?.v || "Other",
          Description: r.c[3]?.v || "",
          Type: r.c[5]?.v ? String(r.c[5].v).trim() : "Expense",
          UID: r.c[6]?.v ? String(r.c[6].v).trim() : "",
          User: r.c[7]?.v ? String(r.c[7].v).trim() : ""
        };
      });
      
    document.getElementById('main-loader').style.display = 'none';

    dataStamp++;
    renderDropdownOptions();
    switchView(currentView);
  } catch(e) {
    console.error(e);
    document.getElementById('main-loader').innerHTML = `<div style="color:var(--semantic-expense); padding:15px; text-align:center;">⚠️ Failed to load data.</div>`;
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

function switchView(view) {
  window.scrollTo(0, 0);
  const isTabChange = view !== currentView;
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.getElementById(`tab-${view}`).classList.add('active');
  const section = document.getElementById(`${view}-view`);
  section.classList.add('active');
  // Shared-axis slide, direction matching tab order — only on an actual tab
  // change, never on initial load or same-view refreshes.
  section.classList.remove('axis-in-left', 'axis-in-right');
  if (isTabChange) {
    section.classList.add(view === 'analytics' ? 'axis-in-left' : 'axis-in-right');
  }
  document.getElementById('nav-slider').style.transform = (view === 'analytics') ? 'translateX(100%)' : 'translateX(0)';
  calculateAndRender();
}

function calculateAndRender() {
  // Skip entirely if this view already shows the current month + data —
  // switching back to a tab should reveal it as-is, not replay everything.
  // (.settled pins child animations, since display:none → block restarts them.)
  const viewKey = `${activeYear}-${activeMonth}-${dataStamp}`;
  const viewEl = document.getElementById(`${currentView}-view`);
  if (renderedKey[currentView] === viewKey) {
    viewEl.classList.add('settled');
    return;
  }
  renderedKey[currentView] = viewKey;
  viewEl.classList.remove('settled');

  // First render of a view gets the full entrance cascade; later re-renders
  // (month switch, post-save refresh) only animate the values.
  const firstEntrance = !hasEntranced[currentView];
  hasEntranced[currentView] = true;
  viewEl.classList.toggle('no-entrance', !firstEntrance);

  const rows = allRows.filter(r => {
    const d = new Date(r.Date);
    const isMonthMatch = d.getMonth() === activeMonth && d.getFullYear() === activeYear;
    
    // Strict Privacy Filter: Must have an activeUser in the URL, 
    // and it must strictly match the row's User column.
    const isUserMatch = activeUser ? (r.User === activeUser) : false;
    
    return isMonthMatch && isUserMatch;
  });

  const totalIncome = rows.filter(r => r.Type === "Income").reduce((s, r) => s + r.Amount, 0);
  const totalExpense = rows.filter(r => r.Type !== "Income").reduce((s, r) => s + r.Amount, 0);
  const netBalance = totalIncome - totalExpense;
  const expenseRows = rows.filter(r => r.Type !== "Income");

  const catTotals = {};
  expenseRows.forEach(r => { catTotals[r.Category] = (catTotals[r.Category] || 0) + r.Amount; });
  const catData = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

  const activeExpenseColor = getComputedStyle(document.documentElement).getPropertyValue('--semantic-expense').trim() || "#E53E3E";
  const activeIncomeColor = getComputedStyle(document.documentElement).getPropertyValue('--semantic-income').trim() || "#00A36C";

    const expChangePct = lastMonth.exp > 0 ? ((totalExpense - lastMonth.exp) / lastMonth.exp * 100) : (totalExpense > 0 ? 100 : 0);

    if (heroChart) heroChart.destroy();
    heroChart = new Chart(document.getElementById('hero-trend'), {
      type: 'bar',
      data: {
        labels: trendMonths.map(m => m.label),
        datasets: [{
          data: trendData,
          backgroundColor: trendData.map((v, i) => i === trendData.length - 1 ? '#C2542D' : hexToRgba(v >= 0 ? activeIncomeColor : activeExpenseColor, 0.35)),
          borderRadius: 4,
          maxBarThickness: 16,
          minBarLength: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: REDUCED_MOTION ? false : { duration: 750, easing: 'easeOutBack' },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: heroTickColor, font: { size: 9, weight: 700 } } },
          y: { display: false, grid: { display: false } }
        }
      }
    });

    if (!rows.length) {
      document.getElementById('home-timeline').innerHTML = '<div class="empty">No records found.</div>';
    } else {
      const groups = {};
      [...rows].sort((a, b) => new Date(b.Date) - new Date(a.Date)).forEach(r => {
        const dateHeader = new Date(r.Date).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        if (!groups[dateHeader]) groups[dateHeader] = [];
        groups[dateHeader].push(r);
      });

      // Rows cascade in top-to-bottom (35ms apart, capped so long lists don't
      // stall); on first entrance they wait for the hero + tiles to land.
      const rowBaseDelay = firstEntrance ? 190 : 0;
      let rowIdx = 0;
      let timelineHtml = '';
      for (const [dateStr, records] of Object.entries(groups)) {
        const dayExpensesTotal = records.filter(r => r.Type !== 'Income').reduce((sum, r) => sum + r.Amount, 0);
        timelineHtml += `<div class="date-group-header">${dateStr}</div><div class="txn-list">`;
        timelineHtml += records.map(r => {
          const isInc = r.Type === "Income";
          const chipColor = isInc ? activeIncomeColor : (CAT_COLORS[r.Category] || CAT_COLORS["Other"]).hex;
          const icon = isInc ? "💰" : (CAT_ICONS[r.Category] || CAT_ICONS["Other"]);
          const rowDelay = rowBaseDelay + Math.min(rowIdx++, 10) * 35;
          return `
            <div class="txn-row" data-uid="${r.UID}" style="--d:${rowDelay}ms">
              <div class="txn-left">
                <div class="txn-icon-chip" style="background:${hexToRgba(chipColor, 0.14)}">${icon}</div>
                <div class="txn-details">
                  <div class="txn-desc">${r.Description}</div>
                  <div class="txn-badge-container"><span class="badge ${isInc ? 'inc-badge' : 'exp-badge'}">${isInc ? 'Income' : r.Category.split(' ')[0]}</span></div>
                </div>
              </div>
              <span class="txn-amt ${isInc ? 'income' : 'expense'}">${isInc ? '+' : ''}RM ${formatCurrency(r.Amount)}</span>
            </div>
          `;
        }).join('');
        timelineHtml += `<div class="txn-footer"><span>Spent this day</span><span class="txn-footer-amt">RM ${formatCurrency(dayExpensesTotal)}</span></div></div>`;
      }
      document.getElementById('home-timeline').innerHTML = timelineHtml;
      document.querySelectorAll('#home-timeline .txn-row[data-uid]').forEach(el => {
        el.addEventListener('click', () => openTxnModal(el.dataset.uid));
      });
    }
  }

  if (currentView === 'analytics') {
    document.getElementById('analytics-insight').innerHTML = buildAnalyticsInsight();

    const today = new Date();
    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const isCurrentMonth = (activeMonth === today.getMonth() && activeYear === today.getFullYear());
    const daysElapsed = isCurrentMonth ? today.getDate() : daysInMonth;
    const dailyBurnRate = daysElapsed > 0 ? (totalExpense / daysElapsed) : 0;

    document.getElementById('analytics-metrics').innerHTML = `
      <div class="tile-block neutral-block">
        <div class="tile-label">Average Daily Spend</div>
        <div class="tile-val counter-val" data-val="${dailyBurnRate}" data-key="an-avg" data-prefix="RM " data-suffix="/day">RM 0.00/day</div>
      </div>
      <div class="tile-block neutral-block">
        <div class="tile-label">Forecasted Spend</div>
        <div class="tile-val counter-val" data-val="${dailyBurnRate * daysInMonth}" data-key="an-fc" data-prefix="RM ">RM 0.00</div>
      </div>
    `;

    // How far through the month we are — the pace baseline the spend bar is read against.
    const monthPct = isCurrentMonth ? Math.min(100, (today.getDate() / daysInMonth) * 100) : 100;

    if (totalIncome > 0) {
      const usedPct = Math.min(100, (totalExpense / totalIncome) * 100);
      const remPct = Math.max(0, 100 - usedPct);

      // Marker + pace commentary only make sense for the live month.
      let markerHtml = '', paceHtml = '';
      const markerStart = barMemory ? barMemory.marker : 0;
      if (isCurrentMonth) {
        markerHtml = `<div class="income-bar-marker" data-label="Today" style="left:${markerStart.toFixed(1)}%"></div>`;
        const diff = usedPct - monthPct;
        let cls = '', word = 'on pace';
        if (diff > 5) { cls = 'ahead'; word = 'ahead of pace'; }
        else if (diff < -5) { cls = 'under'; word = 'under pace'; }
        paceHtml = `<div class="income-bar-pace">Day ${today.getDate()} of ${daysInMonth} · spending <b class="${cls}">${word}</b></div>`;
      }

      // Mount the bar at its previous state (or nearly-empty on first render),
      // then set the real values a frame later so the flex-grow / left
      // transitions actually spring — elements born at their final state
      // never animate.
      const usedFlex = Math.max(usedPct, 4), remFlex = Math.max(remPct, 4);
      const startUsed = barMemory ? barMemory.used : 4;
      const startRem = barMemory ? barMemory.rem : 96;

      document.getElementById('income-bar-block').innerHTML = `
        <div class="income-bar-caption"><span><b>${usedPct.toFixed(0)}%</b> of income spent · ${remPct.toFixed(0)}% left</span><span class="cap-period">${MONTHS[activeMonth]} ${activeYear}</span></div>
        <div class="income-bar-wrap">
          <div class="income-bar-row">
            ${usedPct >= 1 ? `<div class="income-bar-seg used" style="flex-grow:${startUsed}; flex-basis:0;">${usedPct >= 12 ? usedPct.toFixed(0) + '%' : ''}</div>` : ''}
            ${remPct >= 1 ? `<div class="income-bar-seg rem" style="flex-grow:${startRem}; flex-basis:0;">${remPct >= 12 ? remPct.toFixed(0) + '%' : ''}</div>` : ''}
          </div>
          ${markerHtml}
        </div>
        ${paceHtml}
      `;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const usedEl = document.querySelector('#income-bar-block .income-bar-seg.used');
        const remEl = document.querySelector('#income-bar-block .income-bar-seg.rem');
        const markerEl = document.querySelector('#income-bar-block .income-bar-marker');
        if (usedEl) usedEl.style.flexGrow = usedFlex;
        if (remEl) remEl.style.flexGrow = remFlex;
        if (markerEl) markerEl.style.left = monthPct.toFixed(1) + '%';
      }));
      barMemory = { used: usedFlex, rem: remFlex, marker: isCurrentMonth ? monthPct : markerStart };
    } else {
      document.getElementById('income-bar-block').innerHTML = `<div class="income-bar-caption"><span>No income logged this month</span><span class="cap-period">${MONTHS[activeMonth]} ${activeYear}</span></div>`;
    }

    const donutContainer = document.getElementById('donut-container');
    if (donutContainer) donutContainer.innerHTML = '<canvas id="donut"></canvas>';

    if (donutChart) donutChart.destroy();
    if (catData.length) {
      donutChart = new Chart(document.getElementById('donut'), {
        type: 'pie',
        data: {
          labels: catData.map(d => d[0]),
          datasets: [{
            data: catData.map(d => d[1]),
            backgroundColor: catData.map(([cat]) => (CAT_COLORS[cat] || CAT_COLORS["Other"]).hex),
            borderWidth: 1,
            borderColor: 'var(--surface-container-low)',
            offset: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          radius: '90%',
          layout: { padding: { top: 36, bottom: 36, left: 52, right: 52 } },
          plugins: { legend: { display: false }, tooltip: { enabled: false } }
        }
      });
    }

    let lastMo = activeMonth - 1, lastYr = activeYear;
    if (lastMo < 0) { lastMo = 11; lastYr -= 1; }
    
    // Make sure we apply the STRICT user filter to last month's data as well
    const lastMonthExpenseRows = allRows.filter(r => { 
      const d = new Date(r.Date); 
      const isTimeMatch = d.getMonth() === lastMo && d.getFullYear() === lastYr && r.Type !== "Income"; 
      
      const isUserMatch = activeUser ? (r.User === activeUser) : false;
      
      return isTimeMatch && isUserMatch;
    });

    let currentSum = 0, lastSum = 0;
    const currentMonthlyCumulativeData = [], priorMonthlyCumulativeData = [];
    const daysInLastMonth = new Date(lastYr, lastMo + 1, 0).getDate();

    for (let day = 1; day <= daysInMonth; day++) {
      if (!isCurrentMonth || day <= today.getDate()) {
        currentSum += expenseRows.filter(r => new Date(r.Date).getDate() === day).reduce((s, r) => s + r.Amount, 0);
        currentMonthlyCumulativeData.push(currentSum);
      }
      if (day <= daysInLastMonth) {
        lastSum += lastMonthExpenseRows.filter(r => new Date(r.Date).getDate() === day).reduce((s, r) => s + r.Amount, 0);
      }
      priorMonthlyCumulativeData.push(lastSum);
    }

    const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const lineContainer = document.getElementById('cumulative-line-container');
    if (lineContainer) lineContainer.innerHTML = '<canvas id="cumulative-line"></canvas>';

    const activeThisMonthLineColor = isDarkMode ? "#F8F9FA" : "#1A1A1A";

    if (lineChart) lineChart.destroy();
    lineChart = new Chart(document.getElementById('cumulative-line'), {
      type: 'line',
      data: {
        labels: Array.from({ length: daysInMonth }, (_, i) => i + 1),
        datasets: [
          { label: 'This Month', data: currentMonthlyCumulativeData, borderColor: activeThisMonthLineColor, backgroundColor: 'transparent', borderWidth: 3, pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: '#fff', pointBorderColor: activeThisMonthLineColor, pointBorderWidth: 2, tension: 0.1 },
          { label: 'Last Month', data: priorMonthlyCumulativeData, borderColor: isDarkMode ? '#ADB5BD' : '#6C757D', backgroundColor: 'transparent', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, tension: 0.1 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { grid: { display: true, color: isDarkMode ? '#2D2D2D' : '#E9ECEF', lineWidth: 0.5 }, ticks: { color: isDarkMode ? '#CED4DA' : '#495057', font: { size: 10 } } },
          y: { beginAtZero: true, grid: { display: true, color: isDarkMode ? '#2D2D2D' : '#E9ECEF', lineWidth: 0.5 }, ticks: { color: isDarkMode ? '#CED4DA' : '#495057', font: { size: 10 }, callback: (val) => val.toLocaleString('en-US') } }
        }
      }
    });
  }
  animateCounters();
}

function populateCategoryOptions(type, selected) {
  const sel = document.getElementById('modal-category');
  sel.innerHTML = (type === 'Income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function setModalType(type) {
  document.getElementById('modal-type').value = type;
  document.getElementById('type-expense-btn').classList.toggle('active-expense', type === 'Expense');
  document.getElementById('type-income-btn').classList.toggle('active-income', type === 'Income');
  document.getElementById('type-slider').style.transform = type === 'Income' ? 'translateX(100%)' : 'translateX(0)';
  populateCategoryOptions(type, document.getElementById('modal-category').value);
}

// ── Modal focus management ─────────────────────────────────────────────────
// One trap at a time. On open we remember what had focus (the trigger) and
// confine Tab within the sheet; on close we restore focus so keyboard users
// land back where they were.
let modalReturnFocus = null;
let modalTrapHandler = null;

function trapModalFocus(overlay, initial) {
  modalReturnFocus = document.activeElement;
  const sheet = overlay.querySelector('.modal-sheet');
  const focusable = () => [...sheet.querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  modalTrapHandler = (e) => {
    if (e.key !== 'Tab') return;
    const f = focusable();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', modalTrapHandler);
  // preventScroll so the entrance animation isn't yanked by focus scrolling.
  if (initial) requestAnimationFrame(() => initial.focus({ preventScroll: true }));
}

function releaseModalFocus() {
  if (modalTrapHandler) document.removeEventListener('keydown', modalTrapHandler);
  modalTrapHandler = null;
  if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus({ preventScroll: true });
  modalReturnFocus = null;
}

// Escape backs out of the delete confirm first (one step), then closes.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal-overlay').classList.contains('open')) {
    if (document.getElementById('modal-confirm').classList.contains('show')) cancelDeleteConfirm();
    else closeTxnModal();
  } else if (document.getElementById('export-overlay').classList.contains('open')) {
    closeExportModal();
  }
});

function askDeleteConfirm() {
  document.getElementById('modal-main-actions').style.display = 'none';
  document.getElementById('modal-confirm').classList.add('show');
  document.getElementById('modal-confirm-delete-btn').focus({ preventScroll: true });
}

function cancelDeleteConfirm() {
  document.getElementById('modal-confirm').classList.remove('show');
  document.getElementById('modal-main-actions').style.display = 'flex';
  document.getElementById('modal-delete-btn').focus({ preventScroll: true });
}

function resetDeleteConfirm() {
  document.getElementById('modal-confirm').classList.remove('show');
  document.getElementById('modal-main-actions').style.display = 'flex';
}

function openTxnModal(uid) {
  const record = uid ? allRows.find(r => r.UID === uid) : null;
  const isEdit = !!record;

  resetDeleteConfirm();
  document.body.classList.add('modal-open-state');
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-uid').value = isEdit ? uid : '';
  document.getElementById('modal-title').textContent = isEdit ? 'Edit Transaction' : 'Add Transaction';
  document.getElementById('modal-delete-btn').style.display = isEdit ? 'inline-flex' : 'none';

  const type = isEdit ? record.Type : 'Expense';
  setModalType(type);
  populateCategoryOptions(type, isEdit ? record.Category : undefined);

  document.getElementById('modal-amount').value = isEdit ? record.Amount : '';
  document.getElementById('modal-desc').value = isEdit ? record.Description : '';
  document.getElementById('modal-date').value = isEdit ? record.Date : new Date().toISOString().slice(0, 10);

  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  trapModalFocus(overlay, document.getElementById('modal-amount'));
}

function closeTxnModal() {
  document.body.classList.remove('modal-open-state');
  document.getElementById('modal-overlay').classList.remove('open');
  resetDeleteConfirm();
  releaseModalFocus();
}

function showModalError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function saveTxn() {
  const uid = document.getElementById('modal-uid').value;
  const isEdit = !!uid;
  const amount = parseFloat(document.getElementById('modal-amount').value);
  const description = document.getElementById('modal-desc').value.trim();
  const date = document.getElementById('modal-date').value;
  const category = document.getElementById('modal-category').value;
  const type = document.getElementById('modal-type').value;

  if (!date || isNaN(amount) || amount <= 0 || !description) {
    showModalError('Please fill in a valid date, amount, and description.');
    return;
  }

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: isEdit ? 'edit' : 'add', uid, date, amount, category, description, type, user: activeUser })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    await init();
  } catch (e) {
    showModalError('Could not save: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteTxn() {
  const uid = document.getElementById('modal-uid').value;
  if (!uid) return; // intent already confirmed via the in-modal confirm step
  const btn = document.getElementById('modal-confirm-delete-btn');
  btn.disabled = true;
  btn.textContent = 'Deleting…';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: 'delete', uid })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    await init();
  } catch (e) {
    showModalError('Could not delete: ' + e.message);
    cancelDeleteConfirm();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

init();
</script>
