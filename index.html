<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Alfred — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,300..900,75..125&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ────────────────────────────────────────────────────────────
     M3 EXPRESSIVE DESIGN TOKENS
     Source color: jade green (growth/money) → primary
     Secondary: clay red (expense/attention) · Tertiary: violet (forecast)
     Roboto Flex gives us variable weight/width for expressive type.
     ──────────────────────────────────────────────────────────── */
  :root {
    /* color roles */
    --primary: #146C43;
    --on-primary: #FFFFFF;
    --primary-container: #B7F0CE;
    --on-primary-container: #002111;

    --secondary: #C4433E;
    --on-secondary: #FFFFFF;
    --secondary-container: #FFDAD4;
    --on-secondary-container: #410E0A;

    --tertiary: #6552C4;
    --on-tertiary: #FFFFFF;
    --tertiary-container: #E6DEFF;
    --on-tertiary-container: #1D0060;

    --surface: #F9F8F2;
    --surface-container-low: #FFFFFF;
    --surface-container: #F2EFE6;
    --surface-container-high: #EAE6D9;
    --outline: #837F73;
    --outline-variant: #E4E0D4;
    --on-surface: #1B1B17;
    --on-surface-variant: #6F6C61;

    /* shape scale — 5 roundedness levels + full */
    --shape-xs: 6px;
    --shape-sm: 10px;
    --shape-md: 14px;
    --shape-lg: 20px;
    --shape-xl: 28px;
    --shape-full: 999px;

    /* motion — expressive spring easing, physics-based feel */
    --motion-spring-fast: 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
    --motion-spring-default: 450ms cubic-bezier(0.34, 1.35, 0.27, 1);
    --motion-standard: 300ms cubic-bezier(0.2, 0, 0, 1);

    /* type */
    --font-body: 'Roboto Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #7FDBA3;
      --on-primary: #00391D;
      --primary-container: #00522B;
      --on-primary-container: #B7F0CE;

      --secondary: #FFB4AB;
      --on-secondary: #690500;
      --secondary-container: #93000A;
      --on-secondary-container: #FFDAD4;

      --tertiary: #C9BFFF;
      --on-tertiary: #31228F;
      --tertiary-container: #4B3D9E;
      --on-tertiary-container: #E6DEFF;

      --surface: #14140F;
      --surface-container-low: #1E1E1A;
      --surface-container: #232320;
      --surface-container-high: #2B2B26;
      --outline: #928F84;
      --outline-variant: #47443A;
      --on-surface: #E7E3D8;
      --on-surface-variant: #C9C5B9;
    }
  }

  /* Warm surface background, expressive variable-weight type */
  body { 
    font-family: var(--font-body);
    font-variation-settings: 'wght' 400, 'wdth' 100;
    background: var(--surface); 
    color: var(--on-surface); 
    min-height: 100vh; 
    padding-bottom: 105px; 
  }

  /* Streamlined Header Zone */
  .header { 
    background: var(--surface-container-low); 
    padding: 1.25rem 1.5rem; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    border-bottom: 1px solid var(--outline-variant); 
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  /* Editorial-style emphasized headline — heavier weight via variable font axis */
  .header-title { 
    font-size: 20px; 
    font-weight: 800; 
    font-variation-settings: 'wght' 700, 'wdth' 105; 
    color: var(--on-surface); 
    letter-spacing: -0.4px; 
  }
  
  /* Minimal Dropdown Styling */
  .month-select { 
    font-size: 13px; 
    padding: 5px 10px; 
    border-radius: var(--shape-sm); 
    border: 1px solid var(--outline-variant); 
    background: var(--surface-container-low); 
    color: var(--on-surface); 
    cursor: pointer; 
    font-weight: 600; 
    outline: none; 
  }
  
  /* Pixel-centered SVG refresh button */
  .refresh-btn { 
    width: 36px; 
    height: 36px; 
    border-radius: var(--shape-full); 
    border: 1px solid var(--outline-variant); 
    background: transparent; 
    color: var(--on-surface-variant); 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: background var(--motion-standard), transform var(--motion-spring-fast); 
    padding: 0; 
    outline: none;
  }
  .refresh-btn:hover { background: var(--surface-container); }
  .refresh-btn:active { transform: rotate(180deg); }

  /* Bottom control group — FAB + nav pill share one centered row so they
     always sit on the same vertical axis, regardless of screen width. */
  .bottom-bar {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  /* Floating Bottom Navigation Pill — liquid glass finish with 30% contrast edge increase */
  .floating-nav { 
    background: rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.18); 
    border-radius: var(--shape-full); 
    display: flex; 
    align-items: center; 
    padding: 4px; 
    box-shadow: 0 12px 36px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.8);
    width: 260px; 
    height: 54px; 
    overflow: hidden;
  }
  
  /* Responsive, crisp, bouncier 350ms tab transition profiles */
  .nav-btn { 
    flex: 1; 
    border: none; 
    background: transparent; 
    color: var(--on-surface-variant); 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    height: 100%; 
    z-index: 2; 
    transition: color var(--motion-standard), transform var(--motion-spring-default), font-weight var(--motion-standard); 
    outline: none; 
    -webkit-tap-highlight-color: transparent; 
  }
  .nav-btn.active { color: var(--primary); font-weight: 800; transform: scale(1.08); }
  
  .nav-slider { 
    position: absolute; 
    top: 4px; 
    bottom: 4px; 
    left: 4px; 
    width: calc(50% - 4px); 
    background: var(--primary-container);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 14px rgba(0,0,0,0.14), inset 0 1px 1px rgba(255,255,255,0.9);
    border-radius: var(--shape-full); 
    transition: transform var(--motion-spring-default); 
    z-index: 1; 
    pointer-events: none; 
  }

  /* Floating Action Button (new transaction) — glass language with high contrast line edge */
  /* FAB carries the source color — the one bold, high-chroma element in the bar */
  .fab {
    width: 54px;
    height: 54px;
    border-radius: var(--shape-full);
    background: var(--primary);
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: var(--on-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 28px -8px rgba(20, 108, 67, 0.55), inset 0 1px 1px rgba(255,255,255,0.25);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform var(--motion-spring-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.9) rotate(-8deg); }

  .container { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; }
  .view-section { display: none; }
  .view-section.active { display: block; }

  /* Grid Layout: Optimized to fit row cards completely on one page */
  .metric-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 8px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
  }
  @media (max-width: 480px) {
    .metric-grid.home-grid { grid-template-columns: repeat(2, 1fr); }
    .metric-grid.home-grid .balance-card { grid-column: span 2; }
    .metric-grid.analytics-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .metric-grid.analytics-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  /* Highly Rounded Cards with Minimalist Geometry */
  .metric { 
    background: var(--surface-container-low); 
    border-radius: var(--shape-lg); 
    padding: 0.75rem 0.5rem; 
    border: 1px solid var(--outline-variant); 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    min-height: 80px; 
    transition: transform var(--motion-spring-fast);
  }
  .metric-label { 
    font-size: 10px; 
    color: var(--on-surface-variant); 
    margin-bottom: 4px; 
    font-weight: 600; 
    text-transform: uppercase; 
    letter-spacing: 0.3px; 
  }
  /* Numerals get the expressive treatment — heavier weight, tabular width */
  .metric-val { 
    font-size: 14px; 
    font-weight: 700; 
    font-variation-settings: 'wght' 650, 'wdth' 100; 
    white-space: nowrap; 
  }
  .metric-sub { 
    font-size: 9px; 
    color: var(--on-surface-variant); 
    opacity: 0.75;
    margin-top: 3px; 
    font-weight: 500; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }

  @media (min-width: 360px) {
    .metric-val { font-size: 15px; }
    .metric-label { font-size: 11px; }
    .metric-sub { font-size: 10px; }
    .metric { padding: 1rem 0.5rem; min-height: 90px; }
  }
  @media (min-width: 400px) {
    .metric-val { font-size: 17px; }
  }

  /* Soft thematic analytics crystal ball gradient */
  .metric.crystal-ball { 
    background: radial-gradient(circle at 85% 15%, var(--surface-container-low) 0%, var(--tertiary-container) 140%); 
    border-color: var(--tertiary-container); 
  }

  /* Centered layouts for chart cards */
  .charts-row { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; 
    margin-bottom: 1.5rem; 
    width: 100%; 
    justify-content: center; 
  }
  @media (max-width: 768px) { 
    .charts-row { 
      grid-template-columns: 1fr; 
      max-width: 480px; 
      margin: 0 auto 1.5rem auto; 
    } 
  }

  .card { background: var(--surface-container-low); border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); padding: 1.25rem; width: 100%; display: flex; flex-direction: column; }
  .card-title { font-size: 12px; font-weight: 700; margin-bottom: 14px; color: var(--on-surface); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Custom Pill Shape Legendary Alignments */
  .custom-pill-legend { display: flex; gap: 12px; justify-content: center; margin-top: 10px; width: 100%; }
  .pill-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 14px; border-radius: var(--shape-full); border: 1px solid var(--outline-variant); background: var(--surface-container-low); }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .legend-side-box { display: flex; flex-direction: column; gap: 8px; justify-content: center; margin-top: 12px; }
  @media (min-width: 480px) {
    .donut-layout { display: flex; align-items: center; gap: 14px; }
    .donut-container { flex: 1; }
    .legend-side-box { flex: 1; margin-top: 0; }
  }
  
  .legend-row-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: #555; }
  .legend-row-left { display: flex; align-items: center; gap: 6px; }

  .cat-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cat-name { font-size: 12px; color: var(--on-surface-variant); font-weight: 500; width: 110px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-bar-bg { flex: 1; height: 6px; border-radius: var(--shape-full); background: var(--surface-container); overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: var(--shape-full); transition: width var(--motion-spring-default); }
  .cat-amt { font-size: 12px; font-weight: 600; width: 72px; text-align: right; flex-shrink: 0; }

  /* Chronological Timeline Presentation */
  .date-group-header { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); margin: 1.5rem 0 0.5rem 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .txn-list { border-radius: var(--shape-lg); border: 1px solid var(--outline-variant); background: var(--surface-container-low); overflow: hidden; margin-bottom: 0.5rem; }
  
  /* Compact and high-density timeline rows layout */
  .txn-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 10px 1.25rem; 
    border-bottom: 1px solid var(--outline-variant); 
    cursor: pointer;
    transition: background var(--motion-standard);
    -webkit-tap-highlight-color: transparent;
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-row:hover { background: var(--surface-container); }
  .txn-row:active { background: var(--surface-container-high); }
  
  .txn-left { display: flex; align-items: center; gap: 12px; }
  .txn-details { display: flex; flex-direction: column; gap: 2px; }
  .txn-badge-container { display: flex; margin-top: 1px; }

  /* Daily Spent Total Row Footer with left accent bar closer to "Spent" label */
  .txn-footer {
    background: var(--surface-container);
    padding: 11px 1.25rem 11px 1.45rem; 
    position: relative; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--on-surface-variant);
    border-top: 1px solid var(--outline-variant);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  /* Custom floating accent bar in the secondary (expense) tone */
  .txn-footer::before {
    content: '';
    position: absolute;
    left: 10px; 
    top: 8px;   
    bottom: 8px;
    width: 4px;
    background-color: var(--secondary); 
    border-radius: var(--shape-xs); 
  }
  
  .txn-footer-amt {
    color: var(--secondary); 
    font-size: 13.5px;
    font-weight: 800;
  }
  
  /* Balanced, highly stylized outlined semantic tags */
  .badge { font-size: 9px; padding: 1px 6px; border-radius: var(--shape-xs); font-weight: 700; white-space: nowrap; background: transparent; border-width: 1px; border-style: solid; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.inc-badge { color: var(--primary); border-color: var(--primary); }
  .badge.exp-badge { color: var(--secondary); border-color: var(--secondary); }

  .txn-desc { font-size: 13px; font-weight: 600; color: var(--on-surface); line-height: 1.25; }
  .txn-amt { font-size: 13px; font-weight: 700; }
  .txn-amt.income { color: var(--primary); }
  .txn-amt.expense { color: var(--secondary); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--on-surface-variant); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; color: var(--on-surface-variant); font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--outline-variant); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Edit / Add Transaction Modal — Material 3 Expressive Focal Expand */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.32); 
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    display: flex;
    align-items: center;      
    justify-content: center;
    padding: 1rem;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 500ms cubic-bezier(0.34, 0.8, 0.34, 1),
                backdrop-filter 500ms cubic-bezier(0.34, 0.8, 0.34, 1),
                -webkit-backdrop-filter 500ms cubic-bezier(0.34, 0.8, 0.34, 1);
  }
  .modal-overlay.open { 
    opacity: 1; 
    pointer-events: auto;
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
  
  .modal-sheet {
    background: rgba(255, 255, 255, 0.75);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 420px;
    border-radius: var(--shape-xl); 
    padding: 1.75rem 1.5rem;
    box-shadow: 0 24px 48px rgba(0,0,0,0.16);
    max-height: 90vh;
    overflow-y: auto;
    
    /* M3 Expressive Scale/Overshoot Departure States */
    transform: scale(0.85) translateY(20px);
    opacity: 0;
    transition: transform var(--motion-spring-default), opacity 300ms ease;
  }
  /* Material 3 Expressive Entry Profile */
  .modal-overlay.open .modal-sheet { 
    transform: scale(1) translateY(0);
    opacity: 1;
    transition: transform var(--motion-spring-default), opacity 200ms ease;
  }
  .modal-handle { display: none; }
  .modal-title { 
    font-size: 19px; 
    font-weight: 700; 
    font-variation-settings: 'wght' 650, 'wdth' 100; 
    margin-bottom: 1.1rem; 
    color: var(--on-surface); 
  }

  /* Glass segmented control track and slider transitions built on snap physics */
  .type-toggle {
    position: relative;
    display: flex;
    background: rgba(255, 255, 255, 0.4);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: var(--shape-md);
    padding: 3px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .type-toggle-slider {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(255, 255, 255, 1);
    box-shadow: 0 4px 14px rgba(0,0,0,0.14), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    border-radius: var(--shape-sm);
    transition: transform var(--motion-spring-default);
    z-index: 1;
    pointer-events: none;
  }
  .type-toggle button {
    position: relative; z-index: 2;
    flex: 1; border: none; background: transparent; padding: 9px;
    border-radius: var(--shape-sm); font-size: 13px; font-weight: 700; color: var(--on-surface-variant); cursor: pointer;
    transition: color var(--motion-standard), transform var(--motion-spring-default), font-weight var(--motion-standard);
  }
  .type-toggle button.active-expense { color: var(--secondary); font-weight: 800; transform: scale(1.06); }
  .type-toggle button.active-income { color: var(--primary); font-weight: 800; transform: scale(1.06); }

  .form-group { margin-bottom: 0.9rem; }
  .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--on-surface-variant); margin-bottom: 5px; display: block; }
  
  /* Glass inputs with soft blurred ring on active focus layout */
  .form-input, .form-select {
    width: 100%; padding: 11px 12px; border-radius: var(--shape-sm); border: 1px solid rgba(0,0,0,0.06);
    font-size: 14px; font-family: inherit; background: rgba(255, 255, 255, 0.6); color: var(--on-surface); outline: none;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .form-input:focus, .form-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(20, 108, 67, 0.14), 0 0 0 1px var(--primary);
  }

  .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; }
  .btn {
    padding: 13px; border-radius: var(--shape-md); border: none; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform var(--motion-spring-fast);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: scale(0.94); }
  /* Filled M3 button — carries the source color, not a neutral near-black */
  .btn-primary { flex: 1; background: var(--primary); color: var(--on-primary); }
  .btn-primary:disabled { opacity: 0.55; }
  
  .btn-ghost {
    flex: 1; color: var(--on-surface-variant);
    background: rgba(255, 255, 255, 0.45);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, 0.12);
  }
  .btn-danger {
    flex: 0 0 auto; padding: 13px 16px; color: var(--secondary);
    background: rgba(196, 67, 62, 0.12);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(196, 67, 62, 0.4);
  }
  .btn-danger:disabled { opacity: 0.5; }

  .modal-error {
    display: none; background: var(--secondary-container); color: var(--on-secondary-container); font-size: 12px; font-weight: 600;
    padding: 9px 12px; border-radius: var(--shape-sm); margin-bottom: 0.9rem; border: 1px solid rgba(196, 67, 62, 0.3);
  }

  /* Dark mode: color roles above already flip via the :root token override.
     Only glass/translucency treatments (which use fixed rgba white, not
     tokens) need a dark-specific pass here. */
  @media (prefers-color-scheme: dark) {
    .floating-nav {
      background: rgba(30, 30, 28, 0.6);
      border-color: rgba(255, 255, 255, 0.16); 
      box-shadow: 0 12px 36px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.12);
    }
    .nav-slider { border-color: rgba(255,255,255,0.15); }

    .fab { box-shadow: 0 12px 28px -8px rgba(127, 219, 163, 0.35), inset 0 1px 1px rgba(255,255,255,0.2); }

    .modal-overlay { background: rgba(0, 0, 0, 0.55); }
    .modal-sheet {
      background: rgba(30, 30, 28, 0.72);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.06);
    }

    .type-toggle { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
    .type-toggle-slider {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.15);
    }
    
    .form-input, .form-select { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .form-input:focus, .form-select:focus {
      box-shadow: 0 0 0 4px rgba(127, 219, 163, 0.16), 0 0 0 1px var(--primary);
    }
    .btn-ghost { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
    .btn-danger { background: rgba(255,180,171,0.14); border-color: rgba(255,180,171,0.35); }
  }
</style>

</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title-row" style="display: flex; align-items: center; gap: 10px;">

<div class="bottom-bar">

  <div id="analytics-view" class="view-section">
    <div id="analytics-metrics" class="metric-grid analytics-grid"></div>
    <div class="charts-row">
      <div class="card">

        <div id="cumulative-line-container" style="position:relative; width:100%; height:200px">
          <canvas id="cumulative-line"></canvas>
        </div>
        <div class="custom-pill-legend" style="display:flex; gap:10px; justify-content:center; margin-top:10px">
          <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:var(--on-surface-variant); font-weight:600; padding:4px 12px; border-radius:var(--shape-full); border:1px solid var(--outline-variant);">
            <div style="width:8px; height:8px; border-radius:50%; background:#C4433E"></div>This month
          </div>
          <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:var(--on-surface-variant); font-weight:600; padding:4px 12px; border-radius:var(--shape-full); border:1px solid var(--outline-variant);">

          </div>

      <div class="card">
        <div class="card-title">Expenses by Category</div>
        <div class="donut-layout">
          <div id="donut-container" class="donut-container" style="position:relative; width:100%; height:160px">

</div>

<!-- Add / Edit Transaction Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTxnModal()">
  <div class="modal-sheet">

      <button type="button" class="btn btn-primary" id="modal-save-btn" onclick="saveTxn()">Save</button>
    </div>

<script>
const SHEET_ID = "19_C3gFlY7hDjGm87k3Uke63_Tgg6TQPl6xLiGZvuEis";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

// Write endpoint — deployed Apps Script already handles add/edit/delete,
// keyed by UID, and responds with {success:true} or {error:"..."}.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxRLfHCAbCspXIWSRt1xVAbLnNPlhiHHaWpTHGB23N1wkoMU74nHifMT9prU3rM4m6/exec";
const SECRET_KEY = "8891";

// JS mirror of the CSS custom properties in :root — kept in sync manually
// since template-literal inline styles can't read var() at render time.
const THEME = {
  primary: "#146C43",     // income
  secondary: "#C4433E",   // expense
  tertiary: "#6552C4",    // forecast / analytics
  tertiaryOnContainer: "#4B3D9E",
  neutralLine: "#B8B3A3"  // "last month" comparison line
};

// M3-flavored categorical palette — muted, tonal hues rather than flat/neon,
// each roughly matched in chroma so no single category visually dominates.
const CAT_COLORS = {
  "Food & Dining":     { hex: "#C4433E" },
  "Transport":         { hex: "#1B8F82" },
  "Bills & Utilities": { hex: "#C98A1D" },
  "Shopping":          { hex: "#3A66C4" },
  "Groceries":         { hex: "#8A5CC4" },
  "Entertainment":     { hex: "#C4519E" },
  "Other":             { hex: "#7A7669" }
};
// From ALFRED_BOT_CONTEXT.md — used when Type = Income
const INCOME_CATEGORIES = ["Salary", "Freelance", "Bonus", "Investment", "Side Income", "Reimbursement", "Other Income"];

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allRows = [];
let activeMonth = new Date().getMonth();
let activeYear = new Date().getFullYear();
let currentView = 'home';

let donutChart = null;
let lineChart = null;

// Formats currencies dynamically with thousands separator commas
function formatCurrency(num) {
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Register custom positioning calculator to strictly pin the tooltip on the Red Line (Dataset Index 0)
Chart.Tooltip.positioners.thisMonthOnly = function(elements) {
  if (!elements || elements.length === 0) return false;
  const target = elements.find(el => el.datasetIndex === 0);
  if (target && target.element) {
    return { x: target.element.x, y: target.element.y };
  }
  const first = elements[0];
  if (first && first.element) {
    return { x: first.element.x, y: first.element.y };
  }
  return false;
};

const centerTextPlugin = {
  id: 'centerText',
  afterDraw: (chart) => {
    if (chart.config.type !== 'doughnut') return;
    const { ctx, chartArea: { left, top, right, bottom } } = chart;
    const centerX = (left + right) / 2, centerY = (top + bottom) / 2;
    ctx.save();
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.font = '500 11px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#C9C5B9' : '#6F6C61';
    ctx.textAlign = 'center';
    ctx.fillText("Total", centerX, centerY - 10);
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.fillStyle = isDark ? '#E7E3D8' : '#1B1B17';
    ctx.fillText("RM " + formatCurrency(chart.config.options.plugins.centerText.totalAmount), centerX, centerY + 8);
    ctx.restore();
  }
};
Chart.register(centerTextPlugin);

// --- NUMBER COUNTER ANIMATION ENGINE ---
function animateCounters() {
  const counters = document.querySelectorAll('.counter-val');
  counters.forEach(counter => {
    const target = parseFloat(counter.getAttribute('data-val')) || 0;
    const prefix = counter.getAttribute('data-prefix') || "";
    const suffix = counter.getAttribute('data-suffix') || "";
    const duration = 1200; // Animation lasts 1.2 seconds
    let startTimestamp = null;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      
      // Easing function makes it slow down smoothly at the end (ease-out)
      const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      const currentVal = target * easeOut;

      counter.innerHTML = prefix + formatCurrency(currentVal) + suffix;

      if (progress < 1) {
        window.requestAnimationFrame(step);
      } else {
        // Ensure it lands exactly on the target value
        counter.innerHTML = prefix + formatCurrency(target) + suffix;
      }
    };
    
    window.requestAnimationFrame(step);
  });
}

// --- INITIALIZATION & FETCHING ---
async function init() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    
    const text = await res.text();
    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const json = JSON.parse(jsonString);
    
    allRows = json.table.rows
      .filter(r => r.c && r.c[0]?.v && r.c[1]?.v) 
      .map(r => {
        let rawDate = r.c[0].v;
        let formattedDate = "";
        
        if (typeof rawDate === 'string' && rawDate.includes('Date')) {
          const dateParts = rawDate.replace("Date(", "").replace(")", "").split(",");
          const year = dateParts[0];
          const month = String(Number(dateParts[1]) + 1).padStart(2, "0");
          const day = String(dateParts[2]).padStart(2, "0");
          formattedDate = `${year}-${month}-${day}`;
        } else {
          // Strips leading apostrophes if they ever occur again
          formattedDate = String(rawDate).replace(/^'/, ""); 
        }

        return {
          Date: formattedDate,
          Amount: Number(r.c[1].v),
          Category: r.c[2]?.v || "Other",
          Description: r.c[3]?.v || "",
          Type: r.c[5]?.v ? String(r.c[5].v).trim() : "Expense",
          UID: r.c[6]?.v ? String(r.c[6].v).trim() : ""
        };
      });
      
    document.getElementById('main-loader').style.display = 'none';
    renderDropdownOptions();
    switchView(currentView);
    
  } catch(e) {
    console.error("Dashboard Error:", e);
    document.getElementById('main-loader').innerHTML = `
      <div style="background:#fff3f3; color:#c00; padding:15px; border-radius:10px; max-width: 400px; text-align: center;">
        ⚠️ Failed to load data.<br><br>Error: ${e.message}
      </div>`;
  }
}

function switchView(view) {
  window.scrollTo(0, 0);
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  
  document.getElementById(`tab-${view}`).classList.add('active');
  document.getElementById(`${view}-view`).classList.add('active');
  document.getElementById('nav-slider').style.transform = (view === 'analytics') ? 'translateX(100%)' : 'translateX(0)';
  
  calculateAndRender();
}

function renderDropdownOptions() {
  const now = new Date();
  let dropdownHtml = '';
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const valString = `${d.getFullYear()}-${d.getMonth()}`;
    const selected = (d.getMonth() === activeMonth && d.getFullYear() === activeYear) ? 'selected' : '';
    dropdownHtml += `<option value="${valString}" ${selected}>${MONTHS[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  document.getElementById('month-select-element').innerHTML = dropdownHtml;
}

function handleMonthDropdown(val) {
  const parts = val.split('-');
  activeYear = parseInt(parts[0]);
  activeMonth = parseInt(parts[1]);
  calculateAndRender();
}

function calculateAndRender() {
  const rows = allRows.filter(r => {
    const d = new Date(r.Date);
    return d.getMonth() === activeMonth && d.getFullYear() === activeYear;
  });

  const totalIncome = rows.filter(r => r.Type === "Income").reduce((s, r) => s + r.Amount, 0);
  const totalExpense = rows.filter(r => r.Type !== "Income").reduce((s, r) => s + r.Amount, 0);
  const netBalance = totalIncome - totalExpense;

  const expenseRows = rows.filter(r => r.Type !== "Income");
  const catTotals = {};
  expenseRows.forEach(r => { catTotals[r.Category] = (catTotals[r.Category] || 0) + r.Amount; });
  const catData = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const maxCat = catData[0]?.[1] || 1;

  // ── RENDERING: HOME TAB CONTAINER ──
  if (currentView === 'home') {
    const balanceCheekySub = netBalance >= 0 ? "In the green! 🎉" : "Watching the leak ⚠️";
    document.getElementById('home-metrics').innerHTML = `
      <div class="metric">
        <div class="metric-label">Income</div>
        <div class="metric-val counter-val" style="color: ${THEME.primary};" data-val="${totalIncome}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${rows.filter(r => r.Type === "Income").length} items</div>
      </div>
      <div class="metric">
        <div class="metric-label">Expenses</div>
        <div class="metric-val counter-val" style="color: ${THEME.secondary};" data-val="${totalExpense}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${expenseRows.length} items</div>
      </div>
      <div class="metric balance-card">
        <div class="metric-label">Net Balance</div>
        <div class="metric-val counter-val" style="color: ${netBalance >= 0 ? THEME.primary : THEME.secondary};" data-val="${netBalance}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">${balanceCheekySub}</div>
      </div>
    `;

    if (!rows.length) {
      document.getElementById('home-timeline').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No records found this month.</div>';
    } else {
      const sortedRows = [...rows].sort((a, b) => new Date(b.Date) - new Date(a.Date));
      const groups = {};
      sortedRows.forEach(r => {
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        const dateHeader = new Date(r.Date).toLocaleDateString('en-US', options);
        if (!groups[dateHeader]) groups[dateHeader] = [];
        groups[dateHeader].push(r);
      });

      let timelineHtml = '';
      for (const [dateStr, records] of Object.entries(groups)) {
        const dayExpensesTotal = records
          .filter(r => r.Type !== 'Income')
          .reduce((sum, r) => sum + r.Amount, 0);

        timelineHtml += `<div class="date-group-header">${dateStr}</div><div class="txn-list">`;
        timelineHtml += records.map(r => {
          const isInc = r.Type === "Income";
          const displayTag = isInc ? 'Income' : r.Category.split(' ')[0];
          return `
            <div class="txn-row" data-uid="${r.UID}">
              <div class="txn-left">
                <div class="txn-details">
                  <div class="txn-desc">${r.Description}</div>
                  <div class="txn-badge-container">
                    <span class="badge ${isInc ? 'inc-badge' : 'exp-badge'}">
                      ${displayTag}
                    </span>
                  </div>
                </div>
              </div>
              <span class="txn-amt ${isInc ? 'income' : 'expense'}">
                ${isInc ? '+' : ''}RM ${formatCurrency(r.Amount)}
              </span>
            </div>
          `;
        }).join('');
        
        timelineHtml += `
          <div class="txn-footer">
            <span>Spent this day</span>
            <span class="txn-footer-amt">RM ${formatCurrency(dayExpensesTotal)}</span>
          </div>
        `;
        
        timelineHtml += `</div>`;
      }
      document.getElementById('home-timeline').innerHTML = timelineHtml;

      // Wire up tap-to-edit on every rendered transaction row
      document.querySelectorAll('#home-timeline .txn-row[data-uid]').forEach(el => {
        el.addEventListener('click', () => openTxnModal(el.dataset.uid));
      });
    }
  }

  // ── RENDERING: ANALYTICS TAB CONTAINER ──
  if (currentView === 'analytics') {
    const today = new Date();
    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const isCurrentMonth = (activeMonth === today.getMonth() && activeYear === today.getFullYear());
    const daysElapsed = isCurrentMonth ? today.getDate() : daysInMonth;

    const dailyBurnRate = daysElapsed > 0 ? (totalExpense / daysElapsed) : 0;
    const projectedEndSpend = dailyBurnRate * daysInMonth;
    const burnCheekySub = dailyBurnRate > 100 ? "A bit of a splurge? 💸" : "Keeping it chill 🧊";

    document.getElementById('analytics-metrics').innerHTML = `
      <div class="metric">
        <div class="metric-label">Average Daily Spend</div>
        <div class="metric-val counter-val" style="color: ${THEME.secondary};" data-val="${dailyBurnRate}" data-prefix="RM " data-suffix="/day">RM 0.00/day</div>
        <div class="metric-sub">${burnCheekySub}</div>
      </div>
      <div class="metric crystal-ball">
        <div class="metric-label" style="color: ${THEME.tertiary};">🔮 Forecasted Spend</div>
        <div class="metric-val counter-val" style="color: ${THEME.tertiaryOnContainer};" data-val="${projectedEndSpend}" data-prefix="RM ">RM 0.00</div>
        <div class="metric-sub">Where you're landing 🛬</div>
      </div>
    `;

    document.getElementById('donut-legend-rows').innerHTML = catData.map(([cat, val]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS["Other"];
      const pct = totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(0) : 0;
      return `
        <div class="legend-row-item">
          <div class="legend-row-left"><span class="legend-dot" style="background:${c.hex}"></span>${cat.split(' ')[0]}</div>
          <div>${pct}%</div>
        </div>
      `;
    }).join('');

    document.getElementById('bar-breakdown').innerHTML = catData.length ? catData.map(([cat, val]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS["Other"];
      return `
        <div class="cat-row">
          <span class="cat-name">${cat}</span>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(val / maxCat * 100).toFixed(1)}%; background:${c.hex}"></div></div>
          <span class="cat-amt">RM ${formatCurrency(val)}</span>
        </div>
      `;
    }).join('') : '<div style="color:var(--on-surface-variant); font-size:13px; padding:10px 0;">No chart profiles mapped.</div>';

    // Recreation of Donut Canvas Container to prevent duplicate Chart.js overlaps
    const donutContainer = document.getElementById('donut-container');
    if (donutContainer) {
      donutContainer.innerHTML = '<canvas id="donut"></canvas>';
    }

    if (donutChart) donutChart.destroy();
    if (catData.length) {
      donutChart = new Chart(document.getElementById('donut'), {
        type: 'doughnut',
        data: {
          labels: catData.map(d => d[0]),
          datasets: [{ 
            data: catData.map(d => d[1]), 
            backgroundColor: catData.map(([cat]) => (CAT_COLORS[cat] || CAT_COLORS["Other"]).hex), 
            borderWidth: 2, 
            borderColor: '#fff' 
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false, 
          cutout: '72%', 
          plugins: { 
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` RM ${ctx.raw.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
              }
            },
            centerText: { totalAmount: totalExpense } 
          } 
        }
      });
    }

    let lastMo = activeMonth - 1;
    let lastYr = activeYear;
    if (lastMo < 0) { lastMo = 11; lastYr -= 1; }

    const lastMonthExpenseRows = allRows.filter(r => {
      const d = new Date(r.Date);
      return d.getMonth() === lastMo && d.getFullYear() === lastYr && r.Type !== "Income";
    });

    const timelineLabels = Array.from({ length: daysInMonth }, (_, i) => i + 1);
    
    let currentSum = 0;
    const currentMonthlyCumulativeData = [];
    for (let day = 1; day <= daysInMonth; day++) {
      if (isCurrentMonth && day > today.getDate()) break;
      const dayExpenses = expenseRows.filter(r => new Date(r.Date).getDate() === day);
      currentSum += dayExpenses.reduce((s, r) => s + r.Amount, 0);
      currentMonthlyCumulativeData.push(currentSum);
    }

    let lastSum = 0;
    const priorMonthlyCumulativeData = [];
    const daysInLastMonth = new Date(lastYr, lastMo + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      if (day <= daysInLastMonth) {
        const dayExpenses = lastMonthExpenseRows.filter(r => new Date(r.Date).getDate() === day);
        lastSum += dayExpenses.reduce((s, r) => s + r.Amount, 0);
      }
      priorMonthlyCumulativeData.push(lastSum);
    }

    const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    // Recreation of Line Canvas Container to cleanly wipe and detach event configurations
    const lineContainer = document.getElementById('cumulative-line-container');
    if (lineContainer) {
      lineContainer.innerHTML = '<canvas id="cumulative-line"></canvas>';
    }

    const lineCanvas = document.getElementById('cumulative-line');

    if (lineChart) lineChart.destroy();
    lineChart = new Chart(lineCanvas, {
      type: 'line',
      data: {
        labels: timelineLabels,
        datasets: [
          { 
            label: 'This Month', 
            data: currentMonthlyCumulativeData, 
            borderColor: THEME.secondary, 
            backgroundColor: 'transparent', 
            borderWidth: 3, 
            pointRadius: 3,
            pointHoverRadius: 6, // Slightly larger active target node
            pointBackgroundColor: '#fff',
            pointBorderColor: THEME.secondary,
            pointBorderWidth: 2,
            tension: 0.1 
          },
          { 
            label: 'Last Month', 
            data: priorMonthlyCumulativeData, 
            borderColor: THEME.neutralLine, 
            backgroundColor: 'transparent', 
            borderWidth: 2, 
            borderDash: [5, 5], 
            pointRadius: 0, 
            tension: 0.1 
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
          legend: { display: false },
          tooltip: {
            enabled: true,
            position: 'thisMonthOnly',
            intersect: false,
            filter: function(tooltipItem) {
              return tooltipItem.datasetIndex === 0;
            },
            callbacks: {
              label: (ctx) => ` ${ctx.dataset.label}: RM ${ctx.raw.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
            }
          }
        },
        interaction: {
          mode: 'index',
          intersect: false
        },
        scales: {
          x: { 
            grid: { 
              display: true,
              color: isDarkMode ? '#47443A' : '#E4E0D4',
              lineWidth: 0.5
            }, 
            ticks: {
              color: isDarkMode ? '#C9C5B9' : '#6F6C61',
              font: { size: 10 }
            }
          },
          y: { 
            beginAtZero: true, 
            grid: { 
              display: true,
              color: isDarkMode ? '#47443A' : '#E4E0D4',
              lineWidth: 0.5
            },
            ticks: {
              color: isDarkMode ? '#C9C5B9' : '#6F6C61',
              font: { size: 10 },
              callback: (val) => val.toLocaleString('en-US')
            }
          }
        }
      }
    });

    const dismissTooltip = () => {
      if (lineChart) {
        lineChart.setActiveElements([]);
        if (lineChart.tooltip) {
          lineChart.tooltip.setActiveElements([], {});
        }
        lineChart.update('none'); 
      }
    };

    lineCanvas.addEventListener('touchend', dismissTooltip);
    lineCanvas.addEventListener('touchcancel', dismissTooltip);
    lineCanvas.addEventListener('mouseleave', dismissTooltip);
  }

  // Trigger the number slot-machine animation after all HTML is rendered!
  animateCounters();
}

// ─────────────────────────────────────────────────────────────
// ADD / EDIT / DELETE — Transaction Modal
// ─────────────────────────────────────────────────────────────

function populateCategoryOptions(type, selected) {
  const cats = type === 'Income' ? INCOME_CATEGORIES : Object.keys(CAT_COLORS);
  const sel = document.getElementById('modal-category');
  sel.innerHTML = cats.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function setModalType(type) {
  document.getElementById('modal-type').value = type;
  document.getElementById('type-expense-btn').classList.toggle('active-expense', type === 'Expense');
  document.getElementById('type-income-btn').classList.toggle('active-income', type === 'Income');
  document.getElementById('type-slider').style.transform = type === 'Income' ? 'translateX(100%)' : 'translateX(0)';
  populateCategoryOptions(type, document.getElementById('modal-category').value);
}

function openTxnModal(uid) {
  const record = uid ? allRows.find(r => r.UID === uid) : null;
  const isEdit = !!record;

  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-uid').value = isEdit ? uid : '';
  document.getElementById('modal-title').textContent = isEdit ? 'Edit Transaction' : 'Add Transaction';
  document.getElementById('modal-delete-btn').style.display = isEdit ? 'inline-flex' : 'none';

  const type = isEdit ? record.Type : 'Expense';
  
  // Clear any active button text transformation sizes during initial layout populate
  document.getElementById('type-expense-btn').className = '';
  document.getElementById('type-income-btn').className = '';
  
  setModalType(type);
  populateCategoryOptions(type, isEdit ? record.Category : undefined);

  document.getElementById('modal-amount').value = isEdit ? record.Amount : '';
  document.getElementById('modal-desc').value = isEdit ? record.Description : '';
  document.getElementById('modal-date').value = isEdit ? record.Date : new Date().toISOString().slice(0, 10);

  document.getElementById('modal-overlay').classList.add('open');
}

function closeTxnModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function showModalError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function saveTxn() {
  const uid = document.getElementById('modal-uid').value;
  const isEdit = !!uid;

  const amount = parseFloat(document.getElementById('modal-amount').value);
  const description = document.getElementById('modal-desc').value.trim();
  const date = document.getElementById('modal-date').value;
  const category = document.getElementById('modal-category').value;
  const type = document.getElementById('modal-type').value;

  if (!date || isNaN(amount) || amount <= 0 || !description) {
    showModalError('Please fill in a valid date, amount, and description.');
    return;
  }

  const payload = { key: SECRET_KEY, action: isEdit ? 'edit' : 'add', uid, date, amount, category, description, type };

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    document.getElementById('main-loader').innerHTML = '<div class="spinner"></div>Reading your Google Sheet...';
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('analytics-view').classList.remove('active');
    await init();
  } catch (e) {
    showModalError('Could not save: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function deleteTxn() {
  const uid = document.getElementById('modal-uid').value;
  if (!uid) return;
  if (!confirm('Delete this transaction? This cannot be undone.')) return;

  const btn = document.getElementById('modal-delete-btn');
  btn.disabled = true;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SECRET_KEY, action: 'delete', uid })
    });
    const result = await res.json().catch(() => ({ success: true }));
    if (result.error) throw new Error(result.error);

    closeTxnModal();
    document.getElementById('main-loader').style.display = 'flex';
    document.getElementById('main-loader').innerHTML = '<div class="spinner"></div>Reading your Google Sheet...';
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('analytics-view').classList.remove('active');
    await init();
  } catch (e) {
    showModalError('Could not delete: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

init();
</script>
